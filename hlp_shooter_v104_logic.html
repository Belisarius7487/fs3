// ── UPDATE ───────────────────────────────────────────────────
function update(){
  if(paused) return;                  // covers the settings panel too
  fc++;tickStars();tickParts();tickNebula();
  // Der Abbau stand unter "if(GS!=='playing')return;". Nach einem Game
  // Over lief update() also nie mehr bis dorthin, waehrend draw() den
  // Versatz weiter anlegte: der Schirm ruettelte bis zum naechsten Start.
  // Hier oben laeuft der Ruettler der Todesexplosion sauber aus.
  if(shakeT>0 && --shakeT<=0) shakeMag=0;
  tickScan();
  tickDefectors();
  tickDocking();
  tickCapRam();
  tickDeathRoll();
  tickEscapers();
  tickCrossGuards();
  tickComms();
  tickRamming();
  tickEvents();
  tickShipUnlocks();
  if(arriveT>0) arriveT--;
  // Clearing beat: everything loose is pushed off the field under its own
  // power. Der Dunst wird hier NICHT mehr angefasst.
  if(waveOver && waveCd>TRANS_OUT){
    for(const e of enemies) if(e.type==='asteroid'){ e.vx-=0.055; e.vy*=0.99; }
    for(const d of debris){ d.vx-=0.055; d.vy*=0.99; }
  }
  // Der Dunst fiel mit 0.018 je Schritt durch den Raeumtakt und war damit
  // rund 1.6 s vor der Blende weg: der Nebel loeste sich bei vollem Licht
  // auf. Jetzt haengt er an der Blende - soviel Dunst wie Licht. Es ist
  // dieselbe Kurve, aus der die Dunkelheit gezeichnet wird.
  if(waveOver || arriveT>0){
    transFog = Math.min(transFog+0.05, 1-jumpDark());
    // Die Ueberblendung des Hintergrunds startet mit der Dunkelheit, nicht
    // am Wellenende, damit der Wechsel dort liegt wo ihn niemand sieht.
    if(waveOver && waveCd<TRANS_OUT*0.45) startNebFade();
  } else {
    transFog = Math.min(1, transFog+0.05);
  }
  if(GS!=='playing')return;
  if(!callMenu) runTime++;
  // Locked: the ship is committed to the jump. Everything else on the
  // field keeps running, so a wave still finishes cleanly around it.
  if(inJump()){
    player.fT = Math.max(player.fT, 4);
    MOUSE.x = player.x; MOUSE.y = player.y;
  }
  // The pointer is destination and aiming reference at once: the ship
  // flies towards it and the nose points at it. The whole field is open,
  // because enemy fighters do not stay on their half either.
  const pImg=IMGS[player.ship];
  // A hull that can rotate needs a margin that survives any heading, so
  // the wider of the two sprite extents counts, not the height alone.
  const pHalf=pImg ? Math.max(pImg.width,pImg.height)*playerSc()*0.5 : 16;
  const xMin=pHalf, xMax=W-pHalf;
  const yTop=HUD_H+pHalf, yBot=H-pHalf;
  if(inJump()){ player.vx=0; player.vy=0; }
  const targetX=Math.max(xMin,Math.min(xMax,MOUSE.x));
  const targetY=Math.max(yTop,Math.min(yBot,MOUSE.y));
  // Hold radius: inside it the pointer only turns the ship. Past it the
  // speed ramps up over HOLD_BAND instead of switching on at full, and
  // because the ship never closes the gap the offset vector below is
  // always well defined. That is what replaced the pointer speed tracking.
  const pPrevX=player.x, pPrevY=player.y;
  const holdR=Math.max(HOLD_R_MIN, pHalf*HOLD_R_MULT);
  player.holdR=holdR;          // drawn as a ring, so it has to leave update()
  const toX=targetX-player.x, toY=targetY-player.y;
  const toD=Math.sqrt(toX*toX+toY*toY);
  if(toD>holdR){
    const over=toD-holdR;
    const stepLen=Math.min(over, player.spd*Math.min(1, over/HOLD_BAND));
    player.x+=toX/toD*stepLen;
    player.y+=toY/toD*stepLen;
  }
  // Fallback: still support the keyboard
  if(K['ArrowUp']||K['KeyW'])player.y-=player.spd;
  if(K['ArrowDown']||K['KeyS'])player.y+=player.spd;
  if(K['ArrowLeft']||K['KeyA'])player.x-=player.spd;
  if(K['ArrowRight']||K['KeyD'])player.x+=player.spd;
  player.x=Math.max(xMin,Math.min(xMax,player.x));
  player.y=Math.max(yTop,Math.min(yBot,player.y));
  // Movement record, used by enemy gunners to lead their shots.
  player.vx=player.x-pPrevX; player.vy=player.y-pPrevY;
  // Heading: at the pointer while there is a pointer to speak of, else
  // along the keyboard course. Failing both the last commanded direction
  // is kept, so a turn always runs to the end.
  const aimDX=MOUSE.x-player.x, aimDY=MOUSE.y-player.y;
  if(aimDX*aimDX+aimDY*aimDY > AIM_DEAD*AIM_DEAD){
    player.aimAng=Math.atan2(aimDY,aimDX);
  } else if(K['ArrowUp']||K['KeyW']||K['ArrowDown']||K['KeyS']||
            K['ArrowLeft']||K['KeyA']||K['ArrowRight']||K['KeyD']){
    const mvX=player.vx, mvY=player.vy;
    if(mvX*mvX+mvY*mvY > 0.25) player.aimAng=Math.atan2(mvY,mvX);
  }
  let dAng=player.aimAng-player.head;
  while(dAng> Math.PI) dAng-=Math.PI*2;
  while(dAng<-Math.PI) dAng+=Math.PI*2;
  player.head+=Math.max(-(player.turn||PLAYER_TURN),Math.min(player.turn||PLAYER_TURN,dAng));
  if(player.head> Math.PI) player.head-=Math.PI*2;
  else if(player.head<-Math.PI) player.head+=Math.PI*2;
  // head is where the ship points and shoots, ang and flip are only how it
  // gets drawn. Everything downstream reads ang and flip.
  const pPose=poseFor(player.head, player.flip);
  player.ang=pPose.ang; player.flip=pPose.flip;
  if(!inJump()&&(isFiring||MOUSE.down||K['Space']||K['KeyZ'])&&--player.fT<=0){pShoot();player.fT=player.fR;}
  else if(!isFiring&&!MOUSE.down&&!K['Space']&&!K['KeyZ']){if(player.fT>0)player.fT--;}
  // Schild-Aufladung
  if(player.shHit>0){player.shHit--;}
  if(player.shDelay>0){player.shDelay--;}
  else if(!eraShieldsOff() && player.sh<player.maxSh){
    player.sh=Math.min(player.maxSh,player.sh+player.shRecharge);
  }

  updateAllies();
  separateCapitals();
  for(const o of enemies) if(o.img) clampToField(o);
  for(const o of allies)  if(o.img) clampToField(o);
  tickCarry();
  reapEnemies();
  updateAsteroidImpacts();
  updateDebris();
  updateShocks();
  updatePushes();
  updateBombPortals();
  tickScorch(enemies);
  if(allies.length) tickScorch(allies);
  updateSecBullets();
  tickExplQueue();
  if(!waveOver){
    spawnT++;
    while(spawnQ.length&&spawnQ[0].time<=spawnT){
      // Hold back fighters and bombers while the field is already full.
      // Asteroids and capital ships are never delayed: the first are
      // scenery, the second set the shape of the engagement.
      const _nx=spawnQ[0];
      // Wings wait for an empty field instead of for a clock. The old
      // schedule released them on spec.pause regardless of what was still
      // alive, so a slow fight stacked three wings and a fast one left the
      // player waiting at an empty screen. Members of the wing that is
      // already out share its id and are let through, otherwise a
      // formation would block itself after its own first ship.
      if(WING_TYPES[_nx.type] && gateWings && _nx.wing && _nx.wing!==gateWing
         && liveSmallCount()>0){
        for(const s of spawnQ) if(s.wing===_nx.wing) s.time=spawnT+GATE_RETRY;
        break;
      }
      if(WING_TYPES[_nx.type] && liveSmallCount()>=smallCap()){
        // Defer the whole wing, not just its leader, or a formation would
        // arrive in pieces once the cap bites.
        if(_nx.wing){
          for(const s of spawnQ) if(s.wing===_nx.wing) s.time=spawnT+LIVE_SMALL_RETRY;
        } else { _nx.time=spawnT+LIVE_SMALL_RETRY; }
        break;
      }
      const _sp=spawnQ.shift();
      if(WING_TYPES[_sp.type] && _sp.wing) gateWing=_sp.wing;
      // A defector is not an enemy yet, so it never goes through mkEnemy.
      if(_sp.type==='defector'){ spawnDefector(_sp.y, _sp.spr); continue; }
      // A protected non-combatant goes into allies, not enemies. Same hull
      // out of mkEnemy, but from there the ally paths handle it: enemy
      // bolts already test against allies, and updateAllies() already
      // charges GUARD_PENALTY when something carrying guard dies.
      if(_sp.type==='protect'){ spawnProtected(_sp); continue; }
      // Verbuendetes Grosskampfschiff aus ALLY_DEFS.
      if(_sp.type==='ally'){
        const _a = mkAlly(_sp.allyId);
        // initSubsystems fehlte hier seit v90: verbuendete
        // Grosskampfschiffe in geschriebenen Wellen hatten keine.
        if(_a) initSubsystems(_a);
        if(_a && _sp.still){ _a.vy=0; _a.minY=_a.y; _a.maxY=_a.y; }
        if(_a && _sp.crossSecs){
          // Fahrt aus der Querungszeit, damit Uhr und Bild dasselbe sagen:
          // ihre Position IST der Fortschrittsbalken.
          _a.guard = true;
          _a.x = -20;  _a.warpX = _a.x;  _a.warp = 0;
          _a.transit = true;
          const _gi = IMGS[_a.img];
          const _gh = _gi ? _gi.width*_a.sc*0.5 : 120;
          _a.transitEnd = W - _gh - TRANS_EDGE_PAD;
          _a.transitV = (_a.transitEnd - _a.x) / (_sp.crossSecs*TICK_HZ);
          _a.flip = needsFlip(_a.img, false);
          guardWanted = true; guardSpawned = true;
        }
        if(_a){ _a.uid=_sp.uid; if(_sp.uid) EV_SEEN[_sp.uid]=true;
                if(_sp.hpMul) { _a.hp=Math.round(_a.hp*_sp.hpMul); _a.maxHp=Math.max(_a.maxHp,_a.hp); }
                allies.push(_a); }
        continue;
      }
      // Verbuendeter Jaeger.
      if(_sp.type==='allyfi'){
        const _a = mkAllySmall('fighter', currentFaction==='hol'?'vasudan':'terran',
                               _sp.spr || rnd(ROLES.ally_vas_fighters), _sp.y);
        if(_a){ _a.uid=_sp.uid; if(_sp.uid) EV_SEEN[_sp.uid]=true;
                // Wer eine Korvette durchbringt, bekommt kein Kreuzerticket.
                guardReward = (_a.type==='destroyer') ? 'destroyer'
                            : (_a.type==='corvette') ? 'corvette' : 'cruiser';
                _a.defectLock = evWillDefect(_sp.uid); allies.push(_a); }
        continue;
      }
      const _e=mkEnemy(_sp.type, _sp.spr, _sp.y);
      if(_e && _sp.flee) _e.fleeT = _sp.flee*TICK_HZ;if(_e){_e.side='enemy';_e.flip=needsFlip(_e.img,true);if(_e.type==='fighter'||_e.type==='bomber'){const _p=poseFor(_e.head,_e.flip);_e.ang=_p.ang;_e.flip=_p.flip;}_e.warpMax=_e.warp||1;initWeapons(_e);initSecAmmo(_e);initLuciShield(_e);initSubsystems(_e);assignStation(_e);applySpawnOpts(_e,_sp);_e.uid=_sp.uid;if(_sp.uid)EV_SEEN[_sp.uid]=true;_e.hunter=(waveHunt&&Math.random()<HUNT_SHARE);_e.rammer=!!_sp.rammer;enemies.push(_e);}}
    // With a boss calling for more, the queue is never empty for long, but
    // the wave still ends the moment the boss itself dies, because its
    // calls stop with it.
    // On a crossing the rocks never stop, so an empty field is never
    // reached. The escort being through is the whole condition.
    // Three ways a wave can end now. A crossing ends when the escort is
    // through, a disable job when weapons and engines are gone, and
    // everything else when the field is clear. Scenery does not count as
    // clearing work: a standing asteroid field never leaves on its own and
    // would hold the wave open forever.
    if(transitSecs>0 ? guardGone
       : (disableTarget ? disableDone()
          : (!spawnQ.length && !liveThreatCount() && !crossPending() && !evPending() && !escPending()))){
      // She made it: that is the whole objective of the wave.
      if(guardWanted && guardSpawned && !guardLost){
        guardWanted=false;
        tickets[guardReward]=(tickets[guardReward]||0)+1;
        ticketFlash=120; ticketFlashKind=guardReward;
        TICKET_MSGS.push({x:W/2,y:H/2,kind:guardReward,life:190,ml:190,rep:false});
      }
      waveOver=true;
      // The clearing beat stretches if escorts are still jumping out, the
      // jump itself always gets its full TRANS_OUT.
      waveCd=Math.max(TRANS_CLEAR+TRANS_OUT, allies.length?(allies[0].warpMax+TRANS_OUT):0);
      // startNebFade() stand hier, volle 1.6 s bevor das Feld dunkel
      // wurde: der Hintergrund loeste sich sichtbar auf waehrend der
      // Spieler noch flog. Gestartet wird jetzt aus der Dunkelheit.
      }
  }else{
    // Do not pull the player out from under a ticket he can still reach.
    // The clearing beat holds while anything is left on the field; the
    // pickups expire on their own, so this cannot stall.
    if(ITEMS.length>0 && waveCd<=TRANS_OUT+1) waveCd = TRANS_OUT+2;
    else if(--waveCd<=0) nextWave();
  }

  if(eBullets.length>120)eBullets.splice(0,eBullets.length-120);
  for(let i=eBullets.length-1;i>=0;i--){
    const b=eBullets[i];
    if(b.hom){
      if(--b.life<=0){ spawnFireball(b.x,b.y,12,16); eBullets.splice(i,1); continue; }
      // Guided rounds pick whichever friendly target is closest, so an
      // escort cannot simply be flown past. A Pegasus is not on the list:
      // with nothing to lock the round keeps its launch heading and
      // becomes an unguided shot.
      let tx=0, ty=0, bd=Infinity;
      if(canLockOn(player)){
        tx=player.x; ty=player.y;
        bd=(player.x-b.x)**2+(player.y-b.y)**2;
      }
      for(const a of allies){
        if(a.dead || a.warp>0 || a.warpOut>0) continue;
        if(!canLockOn(a)) continue;
        const d=(a.x-b.x)**2+(a.y-b.y)**2;
        if(d<bd){ bd=d; tx=a.x; ty=a.y; }
      }
      // With nothing to lock the round keeps its launch heading and
      // becomes an unguided shot. Only the steering is skipped here.
      // Skipping the rest of the loop as well used to make it a phantom:
      // it passed through every hull, which is what a Pegasus pilot saw.
      if(bd<Infinity){
        const want=Math.atan2(ty-b.y, tx-b.x);
        let cur=Math.atan2(b.vy, b.vx);
        let d=want-cur;
        while(d> Math.PI) d-=Math.PI*2;
        while(d<-Math.PI) d+=Math.PI*2;
        cur += Math.max(-b.turn, Math.min(b.turn, d));
        b.vx=Math.cos(cur)*b.spd; b.vy=Math.sin(cur)*b.spd;
      }
      if(fc%3===0) spawnSmoke(b.x,b.y,1);
    }
    b.x+=b.vx;b.y+=b.vy;
    if(debrisEatsBolt(b)){ eBullets.splice(i,1); continue; }
    if(b.x<-60||b.x>W+60||b.y<-60||b.y>H+60){eBullets.splice(i,1);continue;}
    if(!b.kind && fc%4===0){
      PARTS.push({x:b.x-b.vx*0.5, y:b.y-b.vy*0.5,
        vx:-b.vx*0.10, vy:-b.vy*0.10+(Math.random()-0.5)*0.2,
        life:(6+Math.random()*6)|0, ml:0, sz:0.8+Math.random(),
        clr: b.faction==='shivan' ? '#ff8866' : '#88ffaa'});
    }
    // Crossfire between hostile factions. Same structural point as the
    // defector: a bolt can only hit what its loop actually looks at, and
    // this loop looked at the escorts and the player. The faction on the
    // bolt decides, so a Shivan round passes through Shivan hulls and
    // bites into Vasudan ones.
    if(waveFeud && b.faction){
      let eaten=false;
      for(let fi=enemies.length-1;fi>=0;fi--){
        const o=enemies[fi];
        if(o.dead || o.warp>0 || o.warpOut>0 || o.scenery) continue;
        if(o.type==='asteroid' || playerOnly(o)) continue;
        if(!o.faction || o.faction===b.faction) continue;
        const[ox,oy,ow,oh]=eBox(o);
        if(!overlap(b.x-b.w/2,b.y-b.h/2,b.w,b.h,ox,oy,ow,oh)) continue;
        if(!bulletOnHull(o,b)) continue;
        damageEnemy(o, b.dmg||(b.big?20:8), b.x, b.y, false, 'bolt');
        hullHit(b.x,b.y);
        if(b.kind==='bomb') bombBlast(b.x,b.y);
        // No points and no pickups: the player did not earn this one.
        if(o.hp<=0 && !o.dead) killEnemy(o, fi, false, false);
        eBullets.splice(i,1);
        eaten=true;
        break;
      }
      if(eaten) continue;
    }

    // Escorts are legitimate targets too. Without this an enemy bolt flies
    // straight through a friendly cruiser and only the player can be hit,
    // which made escorts effectively invulnerable to gunfire.
    if(allies.length){
      let consumed=false;
      for(let ai=allies.length-1;ai>=0;ai--){
        const a=allies[ai];
        if(a.dead || a.warp>0 || a.warpOut>0) continue;
        const[ax,ay,aw,ah]=eBox(a);
        if(!overlap(b.x-b.w/2,b.y-b.h/2,b.w,b.h,ax,ay,aw,ah)) continue;
        if(!bulletOnHull(a,b)) continue;      // impact landed on empty space
        let adm=b.dmg||(b.big?20:8);
        if(a.subs) adm=subHit(a, adm, b.x, b.y);   // escorts have them too
        a.hp-=adm;
        hullHit(b.x,b.y);
        if(b.kind==='bomb') bombBlast(b.x,b.y);
        eBullets.splice(i,1);
        consumed=true;
        break;
      }
      if(consumed) continue;
    }

    {
      const[px,py,pw,ph]=pBox();
      if(overlap(b.x-b.w/2,b.y-b.h/2,b.w,b.h,px,py,pw,ph)){
        if(!bulletOnPlayer(b)) continue;   // impact landed on empty space
        const dmg=b.dmg||(b.big?20:8);
        if(player.sh>0){
          const absorbed=Math.min(player.sh,dmg);
          player.sh-=absorbed; player.shDelay=90; player.shHit=SH_FLASH;
          shieldHit(b.x,b.y);
          if(dmg>absorbed){player.hp-=dmg-absorbed;hullHit(b.x,b.y);}
        } else {
          player.hp-=dmg; hullHit(b.x,b.y);
        }
        if(b.kind==='bomb') bombBlast(b.x,b.y);
        eBullets.splice(i,1);if(player.hp<=0)playerDie();}}}

  for(let i=pBullets.length-1;i>=0;i--){
    const b=pBullets[i];b.x+=b.vx; if(b.vy) b.y+=b.vy;
    if(debrisEatsBolt(b)){ pBullets.splice(i,1); continue; }
    // Bolts can now travel in any direction, so the left edge needs a
    // bound too. Without it a shot fired backwards is never cleaned up.
    if(b.x>W+40||b.x<-40||b.y<-40||b.y>H+40){pBullets.splice(i,1);continue;}
    // Faint glowing trail behind every laser bolt
    if(!b.sec && fc%3===0){
      PARTS.push({x:b.x-b.vx*0.6, y:b.y-b.vy*0.6,
        vx:-b.vx*0.10, vy:-b.vy*0.10+(Math.random()-0.5)*0.25,
        life:(7+Math.random()*7)|0, ml:0, sz:0.9+Math.random()*1.1,
        clr: b.ally ? (b.fac==='vasudan'?'#ffd257':'#7fc4ff') : '#ccff88'});
    }
    let hit=false;
    // Incoming bombs can be shot down
    for(let k=eBullets.length-1;k>=0;k--){
      const eb=eBullets[k];
      if(!eb.hp) continue;
      if(overlap(b.x-b.w/2,b.y-b.h/2,b.w,b.h,eb.x-eb.w/2,eb.y-eb.h/2,eb.w,eb.h)){
        if(eb.kind==='bomb'){ bombBlast(eb.x,eb.y); STATS.bombsShot++; }
        else { spawnFireball(eb.x,eb.y,18,20);
               spawnDebris(eb.x,eb.y,8,255,200,80,255,120,0,true); }
        STATS.hits++;
        eBullets.splice(k,1); pBullets.splice(i,1); hit=true; break;
      }
    }
    if(hit) continue;
    for(let j=enemies.length-1;j>=0;j--){
      const e=enemies[j];const[ex,ey,ew,eh]=eBox(e);
      if(overlap(b.x-b.w/2,b.y-b.h/2,b.w,b.h,ex,ey,ew,eh)){
        if(!bulletOnHull(e,b)) continue;   // impact landed on empty space
        if(b.ally && playerOnly(e)) continue;   // allied fire passes through
        laserHit(b.x,b.y);STATS.hits++;e.shotAt=true;damageEnemy(e,(b.dmg||22),b.x,b.y,!b.ally,'bolt');pBullets.splice(i,1);hit=true;
        if(e.hp<=0&&!e.dead){ killEnemy(e, j, true, true); }break;}}if(hit)continue;}

  assignAttackRoles(enemies);
  assignAttackRoles(allies);
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    if(e.type==='fighter'||e.type==='bomber'){
      if(e.warp>0){
        e.warp--;
        e.x-=0.4;
        const wb=shipBound(e);
        e.y=Math.max(HUD_H+wb,Math.min(H-wb,e.y));
        const wp=poseFor(e.head, e.flip);
        e.ang=wp.ang; e.flip=wp.flip;
        continue;
      }
      if(e.shHit>0) e.shHit--;
      if(e.shDelay>0) e.shDelay--;
      else if(e.maxSh && e.sh<e.maxSh) e.sh=Math.min(e.maxSh,e.sh+e.shRe);
      const tgt=flySmall(e);
      if(--e.fT<=0) smallFire(e,tgt);
      fireSecondaries(e, WPN[e.type]);
      // No exit to the left any more. They stay until they are destroyed.
    }
    else if(e.type==='freighter'){
      if(e.warp>0){ e.warp--; e.x-=0.3; continue; }
      // Being shot at, not damage, is what sends it running. The first
      // version asked whether the hull was below maximum, which a drifting
      // asteroid answers just as well as a laser: in the test the freighter
      // bolted every time it clipped a rock. shotAt is set only where a
      // bullet actually strikes.
      if(!e.fleeing && e.shotAt && !e.escaping){ e.fleeing=true; e.vx=-1.9; }
      e.x+=e.vx;
      if(e.x<-140){
        // It got away. The briefing for Small Deadly Space is explicit
        // that this is a defeat, so it is charged like one.
        if(e.runner){
          fleeEscaped++;
          score = Math.max(0, score - RUNNER_PENALTY);
          if(STATS.runnersEscaped==null) STATS.runnersEscaped = 0;
          STATS.runnersEscaped++;
        }
        enemies.splice(i,1); continue;
      }
    }
    else if(e.type==='container'){
      if(e.warp>0){ e.warp--; continue; }
      // Nothing. A container drifts with the field and waits.
    }
    else if(e.type==='sentry'){
      if(e.warp>0){ e.warp--; continue; }
      // The platform cannot move, but it can turn. Facing the player is
      // what lets smallFire() clear its own bearing cone.
      e.head=Math.atan2(player.y-e.y, player.x-e.x);
      if(--e.fT<=0) smallFire(e, player);
    }
    else if(e.type==='asteroid'){
      e.x+=e.vx;e.y+=e.vy;e.rot+=e.rotS;
      if(e.y<20||e.y>H-20)e.vy*=-1;
      if(e.x<-60){enemies.splice(i,1);continue;}}
    else if(e.type==='corvette'||e.type==='destroyer'){
      if(e.warp>0){e.warp--;e.x-=0.2;continue;}
      if(runFlee(e,i)) continue;
      if(e.x>e.targetX)e.x=Math.max(e.targetX,e.x-0.6);
      if(!subOK(e,'engines')) e.vy=0;
      e.y+=e.vy;if(e.y<e.minY||e.y>e.maxY)e.vy*=-1;
      e.y=Math.max(HUD_H+18,Math.min(H-18,e.y));
      if(e.x<-300){enemies.splice(i,1);continue;}
      e.y=Math.max(e.minY,Math.min(e.maxY,e.y));
      capitalFire(e);
    }
    else if(e.type==='cruiser'){
      if(e.warp>0){
        e.warp--;
        e.x-=0.3;
        continue;
      }
      if(runFlee(e,i)) continue;
      // Zu Kampfposition gleiten
      if(e.x>e.targetX) e.x=Math.max(e.targetX,e.x-0.8);
      if(!subOK(e,'engines')) e.vy=0;
      else e.vy=e.vy*0.985+(e.vy>0?1:-1)*0.015*0.6;
      e.y+=e.vy;if(e.y<e.minY||e.y>e.maxY)e.vy*=-1;
      e.y=Math.max(HUD_H+18,Math.min(H-18,e.y));
      if(e.x<-200){enemies.splice(i,1);continue;}
      e.y=Math.max(e.minY,Math.min(e.maxY,e.y));
      if(e.x>W+200){enemies.splice(i,1);continue;}
      capitalFire(e);}
    else if(e.type==='boss'){
      if(e.warp>0){
        e.warp--;
        e.x-=0.3;
        continue;
      }
      // Failsafe only while the boss is still stuck off screen right.
      // This counter used to run all the time and zeroed the hull in the
      // middle of a fight: 1800 steps was 30 seconds at 60 Hz,
      // seconds, but only 18 at 100 Hz.
      if(e.x > W+20){
        e.stuckTimer = (e.stuckTimer||0) + 1;
        if(e.stuckTimer > 900) e.x = e.targetX;   // place it instead of destroying it
      } else e.stuckTimer = 0;

      // Approach. The step needs a floor, otherwise the boss only
      // approaches its station asymptotically and never arrives.
      if(e.x - e.targetX > 1.5){
        e.x = Math.max(e.targetX, e.x - Math.max(0.25, Math.min(1.5,(e.x-e.targetX)*0.04)));
      } else {
        e.x = e.targetX;
      }

      // Bosses had no reason to consult this before, since nothing gave
      // them a deadline. Losing their guns does.
      if(runFlee(e,i)) continue;
      if(e.hp<e.maxHp*.5&&e.phase===1){ e.phase=2; e.fireBoost=0.62; }
      if(!subOK(e,'engines')) e.vy=0;
      e.y+=e.vy*(e.phase===2?1.3:1.0);
      if(e.y<e.minY||e.y>e.maxY)e.vy*=-1;
      e.y=Math.max(e.minY,Math.min(e.maxY,e.y));

      // Fire as soon as the boss is on screen. This call used to sit in the
      // else branch of the approach and was therefore never reached.
      if(e.x < W+40) capitalFire(e);}
    updateBeams(e);
    // Ramming no longer costs anything, in either direction. Hulls pass
    // through one another, weapons are the only thing that does damage.
  }
  // Cleanup: ships that have escaped the play field
  for(let ci=enemies.length-1;ci>=0;ci--){
    const ce=enemies[ci];
    if(ce.x < -400 || ce.x > W+600 || ce.y < -400 || ce.y > H+400){
      enemies.splice(ci,1);
    }
  }

}

// ── DRAW ─────────────────────────────────────────────────────
function draw(){
  // The scale transform used to be set once at startup. If the context is
  // lost and restored, or if a frame throws between save and restore, that
  // single setup is gone for good and every later frame draws unscaled into
  // the top left corner while the clear below misses the rest of the buffer.
  // Re-establishing both every frame turns that into one dropped frame.
  // restore() on an empty stack is defined as a no-op, so draining is safe.
  for(let i = 0; i < 8; i++) ctx.restore();
  ctx.setTransform(RES_X, 0, 0, RES_Y, 0, 0);
  if(shakeT>0){
    const k = shakeMag*(shakeT>12?1:shakeT/12);
    ctx.translate((Math.random()-0.5)*k, (Math.random()-0.5)*k);
  }
  // Nuclear reset: jeder Frame startet sauber
  ctx.globalAlpha=1;
  ctx.globalCompositeOperation='source-over';
  ctx.shadowBlur=0;
  ctx.shadowColor='transparent';
  ctx.lineWidth=1;
  ctx.setLineDash([]);
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  drawNebula();
  drawBodies();
  drawStars();

  if(GS==='title'){drawTitle();return;}
  if(GS==='gameover'){drawGO();return;}

  const loaded=imgsLoaded+nebsLoaded;
  if(loaded<TOTAL){
    ctx.fillStyle='#00ff88';ctx.font='16px Courier New';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('Loading... '+loaded+'/'+TOTAL,W/2,H/2);return;}



  for(const b of pBullets){
    if(!b.sec){
      // Laser: leuchtender Bolt
      const ang=Math.atan2(b.vy,b.vx);
      ctx.save();
      ctx.translate(b.x|0,b.y|0);
      ctx.rotate(ang);
      ctx.globalAlpha=0.85;
      const aGlow = b.ally ? (b.fac==='vasudan'?'rgba(255,200,60,0.32)':'rgba(90,180,255,0.32)')
                           : 'rgba(180,255,80,0.3)';
      const aCore = b.ally ? (b.fac==='vasudan'?'#ffd257':'#7fc4ff') : '#ccff88';
      ctx.fillStyle=aGlow;
      ctx.beginPath();ctx.ellipse(0,0,b.w*.55,b.h*.9,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=aCore;
      ctx.beginPath();ctx.ellipse(0,0,b.w*.38,b.h*.6,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#ffffff';
      ctx.beginPath();ctx.ellipse(0,0,b.w*.15,b.h*.25,0,0,Math.PI*2);ctx.fill();
      ctx.globalAlpha=1;
      ctx.restore();
    } else if(b.sec){
      if(b.type==='missile'){
        // Missile: metallic body plus engine glow
        const mx=(b.x)|0, my=(b.y)|0;
        // Triebwerk-Glow (hinten)
        ctx.fillStyle='rgba(255,120,0,0.5)';
        ctx.beginPath();ctx.ellipse(mx-b.w/2,my,6,4,0,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='rgba(255,200,50,0.8)';
        ctx.beginPath();ctx.ellipse(mx-b.w/2,my,3,2,0,0,Math.PI*2);ctx.fill();
        // Rumpf
        ctx.fillStyle='#aabbcc';
        ctx.fillRect(mx-b.w/2+4,my-2,b.w-6,4);
        // Nase (spitz, vorne)
        ctx.fillStyle='#dd4422';
        ctx.beginPath();ctx.moveTo(mx+b.w/2,my);
        ctx.lineTo(mx+b.w/2-6,my-2);ctx.lineTo(mx+b.w/2-6,my+2);
        ctx.closePath();ctx.fill();
        // Finnen
        ctx.fillStyle='#8899aa';
        ctx.fillRect(mx-b.w/2+4,my-4,5,2);
        ctx.fillRect(mx-b.w/2+4,my+2,5,2);
      } else {
        // Bomb: dark sphere with a pulsing warning glow
        const pulse=0.5+0.5*Math.sin(fc*0.25);
        const br=b.w/2;
        // Outer warning ring
        ctx.strokeStyle='rgba(255,50,0,'+(0.3+pulse*0.5)+')';
        ctx.lineWidth=2;
        ctx.beginPath();ctx.arc(b.x,b.y,br+4+pulse*4,0,Math.PI*2);ctx.stroke();
        // Bomb body
        const grad=ctx.createRadialGradient(b.x-br*0.3,b.y-br*0.3,0,b.x,b.y,br);
        grad.addColorStop(0,'#445566');grad.addColorStop(1,'#111122');
        ctx.fillStyle=grad;
        ctx.beginPath();ctx.arc(b.x,b.y,br,0,Math.PI*2);ctx.fill();
        // Warn-Indikator (blinkt)
        ctx.fillStyle='rgba(255,'+(Math.floor(pulse*80))+',0,'+(0.6+pulse*0.4)+')';
        ctx.beginPath();ctx.arc(b.x,b.y,br*0.35,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#ffffff';
        ctx.beginPath();ctx.arc(b.x-br*0.25,b.y-br*0.25,br*0.1,0,Math.PI*2);ctx.fill();
      }
    } else {
      }
  }

  for(const b of eBullets){
        const bx=b.x|0, by=b.y|0;
    if(b.kind){
      const ang=Math.atan2(b.vy,b.vx);
      const shiv=b.faction==='shivan';
      // NTF ordnance is violet, matching their drives. Without it their
      // missiles look exactly like everyone else's Terran hardware.
      const ntf=b.faction==='ntf';
      const body=shiv?'#ffb0a0':(ntf?'#e0c8ff':'#c8ffe0');
      const glow=shiv?'rgba(255,60,0,0.5)':(ntf?'rgba(160,107,255,0.5)':'rgba(60,255,140,0.5)');

      // Halo underneath the ordnance so it never blends into a nebula.
      // Drawn unrotated and additively, then the body goes on top.
      const halo=(b.kind==='bomb'?2.6:1.9)*b.w*(0.92+0.08*Math.sin(fc*0.5));
      ctx.save();
      ctx.globalCompositeOperation='lighter';
      try{
        const hg=ctx.createRadialGradient(bx,by,0,bx,by,halo);
        hg.addColorStop(0, shiv?'rgba(255,190,150,0.85)':(ntf?'rgba(220,190,255,0.85)':'rgba(190,255,220,0.85)'));
        hg.addColorStop(0.30, shiv?'rgba(255,90,40,0.45)':(ntf?'rgba(150,80,255,0.45)':'rgba(70,255,160,0.45)'));
        hg.addColorStop(1,'rgba(0,0,0,0)');
        ctx.fillStyle=hg;
        ctx.beginPath(); ctx.arc(bx,by,halo,0,Math.PI*2); ctx.fill();
      }catch(ex){}
      ctx.restore();

      // Glowing sparks shed along the flight path
      if(fc%2===0){
        const sa=ang+Math.PI+(Math.random()-0.5)*0.8;
        const sp=0.6+Math.random()*1.4;
        PARTS.push({x:bx,y:by,vx:Math.cos(sa)*sp,vy:Math.sin(sa)*sp,
          life:(12+Math.random()*12)|0, ml:0,
          sz:(b.kind==='bomb'?2.2:1.5)+Math.random(),
          clr: shiv ? (Math.random()<0.5?'#ffdd99':'#ff7744')
             : ntf  ? (Math.random()<0.5?'#ffffff':'#c8a0ff')
                    : (Math.random()<0.5?'#ffffff':'#88ffcc')});
      }

      ctx.save();
      ctx.translate(bx,by); ctx.rotate(ang);
      // Exhaust plume trailing behind
      ctx.globalAlpha=0.75;
      const fl=ctx.createLinearGradient(0,0,-b.w*1.6,0);
      fl.addColorStop(0,'#ffffff'); fl.addColorStop(0.35,shiv?'#ff8844':(ntf?'#b98cff':'#ffcc66'));
      fl.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=fl;
      ctx.beginPath();
      ctx.moveTo(-b.w*0.4,-b.h*0.30);
      ctx.lineTo(-b.w*1.6,0);
      ctx.lineTo(-b.w*0.4, b.h*0.30);
      ctx.closePath(); ctx.fill();
      // Rumpf
      ctx.globalAlpha=0.35; ctx.fillStyle=glow;
      ctx.beginPath(); ctx.ellipse(0,0,b.w*0.95,b.h*0.95,0,0,Math.PI*2); ctx.fill();
      ctx.globalAlpha=1; ctx.fillStyle=body;
      if(b.kind==='bomb'){
        ctx.beginPath(); ctx.arc(0,0,b.w*0.42,0,Math.PI*2); ctx.fill();
        // White hot core so the bomb reads instantly against any background
        ctx.fillStyle='#ffffff';
        ctx.beginPath(); ctx.arc(0,0,b.w*0.20,0,Math.PI*2); ctx.fill();
        ctx.strokeStyle='#ffffff'; ctx.lineWidth=1.6;
        ctx.globalAlpha=0.6+0.4*Math.sin(fc*0.35);
        ctx.beginPath(); ctx.arc(0,0,b.w*0.62,0,Math.PI*2); ctx.stroke();
        // Second, expanding warning ring
        const rr=b.w*(0.62+0.5*((fc%40)/40));
        ctx.globalAlpha=0.38*(1-((fc%40)/40));
        ctx.beginPath(); ctx.arc(0,0,rr,0,Math.PI*2); ctx.stroke();
      } else {
        ctx.beginPath();
        ctx.moveTo(b.w*0.62,0);
        ctx.lineTo(-b.w*0.35,-b.h*0.58);
        ctx.lineTo(-b.w*0.35, b.h*0.58);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle='#ffffff';
        ctx.beginPath();
        ctx.moveTo(b.w*0.34,0);
        ctx.lineTo(-b.w*0.12,-b.h*0.26);
        ctx.lineTo(-b.w*0.12, b.h*0.26);
        ctx.closePath(); ctx.fill();
      }
      ctx.restore(); ctx.globalAlpha=1;
      continue;
    }
    const bShiv=b.faction==='shivan';
    const bC1=bShiv?'rgba(255,30,0,0.35)' :'rgba(0,200,60,0.35)';
    const bC2=bShiv?'#ff4422'             :'#00dd44';
    const bC3=bShiv?'#ffaa88'             :'#aaffaa';
    const bG1=bShiv?'rgba(255,100,0,0.35)':'rgba(0,230,80,0.35)';
    const bG2=bShiv?'#ffaa00'             :'#44ff88';
    if(b.big){
      ctx.globalAlpha=0.9;
      ctx.fillStyle=bG1;
      ctx.beginPath();ctx.ellipse(bx,by,b.w*.65,b.h*.65,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=bG2;
      ctx.beginPath();ctx.ellipse(bx,by,b.w*.4,b.h*.4,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#ffffff';
      ctx.beginPath();ctx.ellipse(bx,by,b.w*.18,b.h*.18,0,0,Math.PI*2);ctx.fill();
    }else{
      // Bolts are no longer horizontal, so the elongated glow has to turn
      // with the flight path or a shot upwards reads as a round blob.
      const bAng=Math.atan2(b.vy,b.vx);
      ctx.globalAlpha=0.3;
      ctx.fillStyle=bC1;
      ctx.beginPath();ctx.ellipse(bx,by,b.w*.9,b.h*.9,bAng,0,Math.PI*2);ctx.fill();
      ctx.globalAlpha=0.9;
      ctx.fillStyle=bC2;
      ctx.beginPath();ctx.ellipse(bx,by,b.w*.5,b.h*.5,bAng,0,Math.PI*2);ctx.fill();
      ctx.globalAlpha=1;
      ctx.fillStyle=bC3;
      ctx.beginPath();ctx.ellipse(bx,by,b.w*.2,b.h*.2,bAng,0,Math.PI*2);ctx.fill();
    }}

  // Warp vortex with a null check and try/catch
  // Sorted by footprint so capital ships sit behind fighters. Residual
  // overlap then reads as depth instead of two hulls clipping.
  const SHIPS_ON_FIELD = (allies.length ? enemies.concat(allies) : enemies.slice())
    .sort(function(a,b){
      const ia=IMGS[a.img], ib=IMGS[b.img];
      const fa=ia?ia.width*a.sc*ia.height*a.sc:0;
      const fb=ib?ib.width*b.sc*ib.height*b.sc:0;
      return fb-fa;
    });
  if(WARP_IMG&&WARP_IMG.complete&&WARP_IMG.naturalWidth>0){
    for(const e of SHIPS_ON_FIELD){
      if(e.warp>0 || e.warpOut>0){
        try{
          // The same duration that drives the ship's visibility.
          var mW=e.warpMax||100;
          var elapsed=e.warpOut>0 ? (mW-e.warpOut) : (mW-e.warp);
          var p1=mW*0.40,p2=mW*0.60;   // opening / open / closing
          var wS,wA;
          if(elapsed<p1){
            var t1=elapsed/p1; wS=0.05+0.95*t1; wA=t1;
          } else if(elapsed<p2){
            wS=1.0; wA=1.0;
          } else {
            var t3=(elapsed-p2)/(mW-p2); wS=1.0-t3; wA=Math.max(0,1.0-t3);
          }
          const wx2=(e.warpX||W-20)|0,wy2=(e.warpY||e.y)|0;
          ctx.save();
          ctx.globalAlpha=wA;
          ctx.translate(wx2,wy2);
          ctx.scale(wS,wS);
          // The vortex has to match the ship coming through it.
          // These used to be fixed per class, matching the old,
          // kleineren Sprites gehoerten.
          var WS=120;
          var wImg=IMGS[e.img];
          if(wImg) WS=Math.max(100, wImg.height*e.sc*1.9, wImg.width*e.sc*0.62);
          var wF=Math.floor(elapsed/mW*WARP_FRAMES);
          if(wF<0) wF=0; if(wF>WARP_FRAMES-1) wF=WARP_FRAMES-1;
          ctx.drawImage(WARP_IMG,
            (wF%WARP_COLS)*WARP_CELL, ((wF/WARP_COLS)|0)*WARP_CELL,
            WARP_CELL, WARP_CELL,
            -WS/2,-WS/2,WS,WS);
          ctx.restore();
          ctx.globalAlpha=1;
        }catch(ew){ctx.restore();ctx.globalAlpha=1;}
      }
    }
  }

  // Wreckage sits behind the ships: it is scenery that bites, not a unit.
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  drawDebris();

  // State-Reset vor Enemy-Render
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  for(const e of SHIPS_ON_FIELD){
    try{
    // Ship only visible once the vortex is fully open (phase 2 and 3)
    // wAlpha carries the fade in from the vortex. It used to be
    // wiped out one line later by globalAlpha=1,
    // which is why ships used to pop in.
    var wAlpha=1;
    if(e.warp>0){
      var mWw=e.warpMax||100;
      var elW=mWw-e.warp;
      if(elW<mWw*0.40) continue;                 // vortex not open yet
      if(elW<mWw*0.60) wAlpha=(elW-mWw*0.40)/(mWw*0.20);
    } else if(e.warpOut>0){
      // Reversed sequence: vortex opens, ship disappears into it
      var mWo=e.warpMax||100;
      var elO=mWo-e.warpOut;
      if(elO>mWo*0.60) continue;                 // ship has gone through
      if(elO>mWo*0.40) wAlpha=1-(elO-mWo*0.40)/(mWo*0.20);
    }
    ctx.globalAlpha=wAlpha;
    // No damage blink. The hull bar already carries that information.
    if(e.type==='asteroid'){
      const r=16*e.sc;
      if(e.tex==null) e.tex=(Math.random()*AST_VARIANTS)|0;
      const t=AST_TEX[e.tex];
      if(t){
        const d=r/t.R*t.S;
        ctx.save();
        ctx.translate(e.x|0,e.y|0); ctx.rotate(e.rot);
        ctx.drawImage(t.c, -d/2, -d/2, d, d);
        ctx.restore();
        drawRockLight(e, r);
      }
    }else{
      drawThrusters(e.img,e.x|0,e.y|0,e.sc,e.flip,e.faction,e.warp>0?0.35:1,e.ang||0);
      drawShip(e.img,e.x|0,e.y|0,e.sc,e.flip,e.ang||0);
      drawHostileMark(e);
      drawScorch(e);
      drawShield(e);
      drawScanRing(e);

      if(e.type==='cruiser'||e.type==='corvette'||e.type==='destroyer'||
         e.type==='boss'||e.type==='station'){
        const hbImg=IMGS[e.img];if(hbImg){
          var bwMult=(e.type==='boss'?0.75:(e.type==='destroyer'?0.55:0.70));
          const bw=hbImg.width*e.sc*bwMult;
          const bx=(e.x-bw*.5)|0,by=(e.y-hbImg.height*e.sc*.5-6)|0;
          ctx.globalAlpha=1;
          // While the shield holds, the hull bar would sit at full and say
          // nothing. Show the shield instead, so the bar always tracks what
          // is actually being shot at.
          var showShield=(e.bShield>0);
          var hpRatio=showShield?Math.max(0,e.bShield/e.bShieldMax)
                                :Math.max(0,e.hp/e.maxHp);
          // Fill says condition, outline says side. One meaning per
          // channel, so a glance at the colour is never ambiguous.
          drawHullBlocks(e, bx, by, bw, hpRatio, showShield);
        }}}
    ctx.globalAlpha=1;
    if(e.bShield>0){ drawLuciShield(e); drawReactors(e); }
    else drawSubsystems(e);
    drawBeams(e);
    }catch(ee){ctx.restore();ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';}}
  ctx.shadowBlur=0;ctx.shadowColor='transparent';

  try{
    drawHoldRing();
    {
      const _pf=player.flip||false;
      const _js=jumpScale();
      if(_js>=1){
        drawThrusters(player.ship,player.x|0,player.y|0,playerSc(),_pf,'terran',
          (K['ArrowRight']||K['d']||K['D'])?1.35:((K['ArrowLeft']||K['a']||K['A'])?0.45:1),
          player.ang||0);
      }
      drawShip(player.ship,player.x|0,player.y|0,playerSc()*_js,_pf,player.ang||0);
      if(_js>=1) drawPlayerShield();
      drawJumpVortex();
    }
  }catch(ep2){ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';}
  // Fadenkreuz an Mausposition
  const mx=MOUSE.x|0,my=MOUSE.y|0;
  ctx.strokeStyle=MOUSE.down?'rgba(255,255,100,0.9)':'rgba(0,255,136,0.7)';
  ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(mx-10,my);ctx.lineTo(mx+10,my);ctx.stroke();
  ctx.beginPath();ctx.moveTo(mx,my-10);ctx.lineTo(mx,my+10);ctx.stroke();
  ctx.beginPath();ctx.arc(mx,my,4,0,Math.PI*2);ctx.stroke();

  try{drawParts();}catch(ep){}

  // Treffer-Flashes
  if(shieldFlash>0){
    ctx.fillStyle='rgba(0,100,255,'+(shieldFlash/8*0.07)+')';
    ctx.fillRect(0,0,W,H); shieldFlash--;
  }
  if(hullFlash>0){
    ctx.fillStyle='rgba(255,80,0,'+(hullFlash/7*0.08)+')';
    ctx.fillRect(0,0,W,H); hullFlash--;
  }

  // HUD IMMER — State garantiert sauber
  ctx.globalAlpha=1;
  ctx.globalCompositeOperation='source-over';
  ctx.shadowBlur=0;
  // Haze and interference sit over ships and wreckage. Pickups and
  // messages go on top of them, so nothing is lost in the murk that the
  // player has no way to shoot at.
  drawBombPortals();
  drawShocks();
  drawNebulaFog();
  drawEmpWarn();
  drawEmpFX();
  drawItems();
  drawTicketMsgs();
  drawSubMsgs();
  // The shake must not reach the instruments, so the transform is put
  // back before the strip is drawn.
  ctx.setTransform(RES_X, 0, 0, RES_Y, 0, 0);
  drawHUD();
  // Blackout is drawn over the strip rather than skipping it, so the
  // instruments visibly fail instead of quietly disappearing.
  drawEmpHudGlitch();
  drawFleeWarning();
  drawFieldBanner();
  tickFps();
  drawFps();
  drawObjCount();
  drawWaveTitle();
  drawSettings();
  // Opening the settings pauses the game, so without this the pause
  // notice printed straight across the panel it had just opened.
  if(paused && !settingsOpen){
    ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ffffff';ctx.font='bold 32px Courier New';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('PAUSED',W/2,H/2-20);
    ctx.font='14px Courier New';ctx.fillStyle='#aaaaaa';
    ctx.fillText('Press P or tap to resume',W/2,H/2+20);
    ctx.textAlign='left';ctx.textBaseline='top';
  }
}

// The countdown used to live in the HUD bar, in the same strip as the
// escort status panel and only while no escort was deployed, so calling
// support hid the one piece of information with a deadline on it. On the
// top edge of the field it has no competition.
// The ticket grid now fills the whole strip the boss notice used to share,
// so it moves down here alongside the jump out countdown. The two can never
// appear together: only the Runner wave has a deadline and it has no boss.
// Alle 120 Eintraege der Mount-Datei tragen ihren Namen im Feld tags,
// vom GTSC Faustus bis zur VC 3. MOUNTS liegt ohnehin im Build, die
// Zielanzeige braucht also keine zweite Namenstabelle - und keine zweite
// Kopie, die auseinanderlaufen kann.
//
// Neun vasudanische Eintraege fuehren BEIDE Praefixe, weil das Schiff je
// nach Aera anders heisst: zu FS1- und ST:R-Zeiten Parlamentsflotte (PV),
// nach dem Beitritt zur GTVA Gemeinschaftsflotte (GV). Ungefiltert stuende
// im Bild "STOP 2 PVFR OR GVFR MA'AT".
// Betroffen: Osiris, Aten, Typhon, Horus, Seth, Thoth, Ma'at, Satis, Isis.
// Gewaehlt wird nach Praefix und nicht nach Position, damit ein Eintrag in
// der Reihenfolge "GVF or PVF" nicht die falsche Haelfte liefert.
const NAME_ALT = /^([A-Za-z]+) or ([A-Za-z]+) (.+)$/;
function shipName(key, fallback){
  const m = mountsFor(key);
  let t = m && m.tags && m.tags[0];
  if(!t) return (fallback || 'SHIP').toUpperCase();
  const a = NAME_ALT.exec(t);
  if(a){
    const want = (currentEra === 'fs2') ? 'GV' : 'PV';
    const pick = (a[1].indexOf(want) === 0) ? a[1]
               : ((a[2].indexOf(want) === 0) ? a[2] : a[1]);
    t = pick + ' ' + a[3];
  }
  return t.toUpperCase();
}

// Was der Spieler gerade zu tun hat, in der Reihenfolge, in der es
// dringend ist. Gelesen wird der Zustand des Feldes, nicht der Wellenplan:
// ein Ziel, das erledigt ist, verschwindet damit von selbst.
function objectiveText(){
  for(const a of allies)
    if(a.guard && !a.dead)
      return {txt:'[ PROTECT THE '+shipName(a.img, a.label || 'ESCORT')+' ]',
              col:'#ffbb22', ink:'#ffd257'};
  if(disableTarget && !disableTarget.dead && !disableDone())
    return {txt:'[ DISABLE THE '+shipName(disableTarget.img,'TARGET')+' ]',
            col:'#22bbff', ink:'#7fd6ff'};
  let nScan=0, nRun=0;
  for(const e of enemies){
    if(e.dead) continue;
    if(e.scan && !e.scanned) nScan++;
    if(e.runner) nRun++;
  }
  if(nScan)
    return {txt:'[ SCAN '+nScan+' CARGO ]', col:'#22bbff', ink:'#7fd6ff'};
  let nEsc=0;
  for(const e of enemies) if(e.escaping && !e.dead) nEsc++;
  if(nEsc)
    return {txt:'[ STOP '+nEsc+' RUNNER'+(nEsc>1?'S':'')+' ]',
            col:'#ffbb22', ink:'#ffd257'};
  if(nRun)
    return {txt:'[ STOP '+nRun+' FREIGHTER'+(nRun>1?'S':'')+' ]',
            col:'#ffbb22', ink:'#ffd257'};
  return null;
}

// Wie lange nach Erledigung eines Auftrags die Erfolgsmeldung steht.
const OBJ_DONE_TIME = 220;    // 2,2 s
let objWasSet = false, objDoneT = 0, objFailed = false;
// Gerettete und verlorene Schuetzlinge dieser Welle. Daraus entsteht der
// dritte Ausgang zwischen Erfolg und Fehlschlag.
let protSaved = 0, protLost = 0;

// Titel der laufenden Welle. Wird von buildFS1Wave gesetzt und in
// nextWave geleert, damit eine Welle ohne Titel nicht den vorigen erbt.
let waveTitle='', titleT=0;
const TITLE_TIME=300;      // 3 s bei 100 Schritten je Sekunde
function drawWaveTitle(){
  return;   // Wellenueberschrift abgeschaltet, siehe Kommentar oben
  /* eslint-disable no-unreachable */
  if(GS!=='playing' || !waveTitle || titleT<=0) return;
  if(!paused) titleT--;
  // Weicher Ausklang im letzten Drittel, damit er nicht abgeschnitten wirkt.
  const a = Math.min(1, titleT/(TITLE_TIME*0.34));
  ctx.save();
  ctx.globalAlpha = a;
  ctx.font='bold 15px Courier New';
  ctx.textAlign='center'; ctx.textBaseline='top';
  const tw=ctx.measureText(waveTitle).width;
  ctx.globalAlpha=a*0.66; ctx.fillStyle='#000';
  ctx.fillRect(((W-tw)/2-12)|0, (H*0.30)|0, (tw+24)|0, 24);
  ctx.globalAlpha=a;
  ctx.strokeStyle='#00aa44'; ctx.lineWidth=1;
  ctx.strokeRect(((W-tw)/2-12)|0, (H*0.30)|0, (tw+24)|0, 24);
  ctx.fillStyle='#00ee55';
  ctx.fillText(waveTitle, W/2, (H*0.30)|0+5);
  ctx.restore();
  /* eslint-enable no-unreachable */
}

const CHEV_FULL = 120;    // bis hierher voll sichtbar
const CHEV_FADE = 240;    // ab hier gar nicht mehr - Nebelsichtweite
function drawHostileMark(e){
  // SHIPS_ON_FIELD ist enemies.concat(allies) - ohne diese Zeile bekaeme
  // jeder Verbuendete denselben Winkel. Ein Ueberlaeufer hat nach defect()
  // side='enemy' und bekommt ihn dann zu Recht.
  if(e.side === 'ally') return;
  if(e.type!=='fighter' && e.type!=='bomber') return;
  if(e.dead || e.warp>0 || e.warpOut>0) return;
  let a = 1;
  if(nebulaOn()){
    const d = Math.hypot(e.x-player.x, e.y-player.y);
    if(d >= CHEV_FADE) return;
    a = (d <= CHEV_FULL) ? 1 : (CHEV_FADE-d)/(CHEV_FADE-CHEV_FULL);
  }
  const img = IMGS[e.img];
  const h = img ? img.height*e.sc : 30;
  const y = e.y - h*0.5 - 9;
  // Im Anflug ein anderes Zeichen: ein Schiff, das gleich einschlaegt,
  // soll sich von einem unterscheiden, das nur vorbeifliegt. In FreeSpace
  // warnt der Funk davor - hier muss es das Bild tun.
  // Gelb nur, wenn dieser Bomber gerade ein verbuendetes Grosskampfschiff
  // anfliegt - dann lohnt es, ihn vorzuziehen. Ein Anflug auf den Spieler
  // bleibt rot wie jeder andere Gegner.
  let run = false;
  if((e.type==='bomber'||e.rammer) && e.role==='attack' && e.passT<=0){
    const t = smallTarget(e);
    run = !!(t && t!==player && !t.small && t.side==='ally');
  }
  ctx.save();
  ctx.globalAlpha = a;
  ctx.strokeStyle = run ? '#ffcc22' : '#ff2a1a';
  ctx.lineWidth = 2;
  ctx.beginPath();
  if(run){
    // Doppelwinkel, blinkend
    if(fc%24 < 17){
      ctx.moveTo(e.x-7, y-6); ctx.lineTo(e.x, y);   ctx.lineTo(e.x+7, y-6);
      ctx.moveTo(e.x-7, y-11);ctx.lineTo(e.x, y-5); ctx.lineTo(e.x+7, y-11);
    }
  } else {
    ctx.moveTo(e.x-6, y-5); ctx.lineTo(e.x, y); ctx.lineTo(e.x+6, y-5);
  }
  ctx.stroke();
  ctx.restore();
}

function drawFieldBanner(){
  if(GS!=='playing') return;
  // The countdowns no longer suppress it, they just push it down a row.
  let txt=null, col='#ff2200', ink='#ff4422';
  const ob=objectiveText();
  if(ob){
    txt=ob.txt; col=ob.col; ink=ob.ink;
    objWasSet = true; objSeenOnce = true;
  } else {
    // Gab es einen Auftrag und ist er jetzt weg, war er erledigt. Ohne
    // diese Meldung verschwindet die Zeile stumm und der Spieler weiss
    // nicht, ob er fertig ist oder etwas uebersehen hat.
    if(objWasSet){ objWasSet = false; objDoneT = OBJ_DONE_TIME; objFailed = guardLost; }
    const bossInQ=spawnQ.some(function(s){return s.type==='boss_ntf'||s.type==='boss_sh';});
    if(objDoneT>0){
      if(!paused) objDoneT--;
      if(objFailed && protSaved>0){
        // Ein Teil ist durchgekommen: weder Erfolg noch Fehlschlag.
        txt='[ PARTIAL SUCCESS  '+protSaved+'/'+(protSaved+protLost)+' ]';
        col='#bb8800'; ink='#ffcc44';
      }
      else if(objFailed){ txt='[ OBJECTIVE FAILED ]'; col='#cc2200'; ink='#ff5533'; }
      else              { txt='[ OBJECTIVE COMPLETE ]'; col='#00cc44'; ink='#4dff88'; }
    }
    else if(bossInQ||bossAlive) txt='[ BOSS FIGHT ]';
    // Sonst: aufraeumen. Die Zeile bleibt stehen, solange noch etwas im
    // Feld oder in der Warteschlange steht.
    else if(!spawnQ.length && liveThreatCount()>0)
      { txt='[ CLEAR THE FIELD ]'; col='#ff2200'; ink='#ff4422'; }
  }
  if(!txt) return;
  if(fc%60>=42) return;
  ctx.save();
  ctx.font='bold 12px Courier New';
  ctx.textAlign='center'; ctx.textBaseline='top';
  // Pushed below whatever countdowns are running.
  const rows=Math.min(FLEE_ROWS, fleeingEnemies().length);
  const tw=ctx.measureText(txt).width;
  const bx=((W-tw)/2-10)|0, by=HUD_H+6+rows*23;
  ctx.globalAlpha=0.72; ctx.fillStyle='#000';
  ctx.fillRect(bx,by,(tw+20)|0,20);
  ctx.globalAlpha=1;
  ctx.strokeStyle=col; ctx.lineWidth=1;
  ctx.strokeRect(bx,by,(tw+20)|0,20);
  ctx.fillStyle=ink;
  ctx.fillText(txt,W/2,by+5);
  ctx.restore();
  ctx.textAlign='left'; ctx.textBaseline='top';
}

// Stacked, most urgent at the top. Three at once is already more capital
// ships than any wave fields, so the list is capped there.
const FLEE_ROWS = 3;
function drawFleeWarning(){
  if(GS!=='playing') return;
  const list=fleeingEnemies();
  if(!list.length) return;
  ctx.save();
  ctx.font='bold 12px Courier New';
  ctx.textAlign='center'; ctx.textBaseline='top';
  let row=0;
  for(const flr of list){
    if(row>=FLEE_ROWS) break;
    const sec=Math.ceil(flr.fleeT/TICK_HZ);
    const urgent=sec<=10;
    const by=HUD_H+6+row*23;
    row++;
    if(urgent && fc%40>=28) continue;      // blink once it gets tight
    const txt=(flr.label||(flr.type||'CAPITAL SHIP').toUpperCase())+
              (flr.disarmed?' WITHDRAWING IN ':' JUMPING OUT IN ')+sec+'s';
    const tw=ctx.measureText(txt).width;
    const bx=((W-tw)/2-10)|0;
    ctx.globalAlpha=0.72;
    ctx.fillStyle='#000';
    ctx.fillRect(bx, by, (tw+20)|0, 20);
    ctx.globalAlpha=1;
    ctx.strokeStyle=urgent?'#ff5500':'#ffbb22'; ctx.lineWidth=1;
    ctx.strokeRect(bx, by, (tw+20)|0, 20);
    ctx.fillStyle=urgent?'#ff7733':'#ffcc44';
    ctx.fillText(txt, W/2, by+5);
  }
  ctx.restore();
  ctx.textAlign='left'; ctx.textBaseline='top';
}

// A gear, drawn rather than an image, so it needs no asset and scales.
function drawGear(cx, cy, r, col){
  ctx.save();
  ctx.translate(cx, cy);
  ctx.strokeStyle=col; ctx.fillStyle=col; ctx.lineWidth=1.6;
  for(let i=0;i<6;i++){
    const a=i*Math.PI/3;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a)*r*0.62, Math.sin(a)*r*0.62);
    ctx.lineTo(Math.cos(a)*r*1.25, Math.sin(a)*r*1.25);
    ctx.stroke();
  }
  ctx.beginPath(); ctx.arc(0,0,r*0.68,0,Math.PI*2); ctx.stroke();
  ctx.restore();
}

// ── SETTINGS PANEL ─────────────────────────────────────────
// Only one entry today. It exists as a panel because the alternative is
// to hang each new option off its own button in a bar that is already
// full.
let settingsOpen=false;
let settingsPage=0;          // 0 = Spiel, 1 = Sparmodus
// Wird vom Packer aus dem Dateinamen der Logikdatei gesetzt, damit die
// Nummer nicht von Hand gepflegt werden muss und nicht driften kann.
const GAME_VERSION='dev';
let showFps=false;
let fpsVal=0, fpsFrames=0, fpsLast=0;
function tickFps(){
  fpsFrames++;
  const now = (typeof performance!=='undefined' && performance.now) ? performance.now() : Date.now();
  if(!fpsLast){ fpsLast=now; return; }
  if(now-fpsLast >= 500){
    fpsVal = Math.round(fpsFrames*1000/(now-fpsLast));
    fpsFrames=0; fpsLast=now;
  }
}
// Oben rechts unter der Leiste, wo nichts anderes liegt. Courier ist eine
// Festbreitenschrift, ein Zeichen ist 0.6 mal die Schriftgroesse breit -
// bei 11 px also 6.6 px. 'FPS 120' sind sieben Zeichen und damit 46.2 px,
// der Kasten ist 54 breit.
function drawFps(){
  if(!showFps) return;
  const txt='FPS '+(fpsVal||'--');
  ctx.save();
  ctx.font='bold 11px Courier New';
  ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.globalAlpha=0.72; ctx.fillStyle='#000';
  ctx.fillRect(W-60, HUD_H+4, 54, 15);
  ctx.globalAlpha=1;
  ctx.fillStyle = fpsVal && fpsVal<40 ? '#ff9900' : '#00ee55';
  ctx.fillText(txt, W-56, HUD_H+6);
  ctx.restore();
}
// Objektzaehler. Drei Zahlen statt einer Summe: eine Summe sagt, dass es
// waechst, drei sagen welche Liste waechst. Courier ist eine
// Festbreitenschrift, ein Zeichen ist 0.6 mal die Schriftgroesse breit -
// bei 11 px also 6.6. Der laengste denkbare Text 'OBJ 999/9999/999' hat
// 16 Zeichen und damit 105.6 px, der Kasten ist 112 breit.
let showObj=false;
function drawObjCount(){
  if(!showObj) return;
  const ships = enemies.length + allies.length;
  const shots = pBullets.length + eBullets.length;
  const junk  = debris.length + PARTS.length + ITEMS.length;
  const txt = 'OBJ '+ships+'/'+shots+'/'+junk;
  ctx.save();
  ctx.font='bold 11px Courier New';
  ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.globalAlpha=0.72; ctx.fillStyle='#000';
  ctx.fillRect(W-118, HUD_H+22, 112, 15);
  ctx.globalAlpha=1;
  ctx.fillStyle='#66ccff';
  ctx.fillText(txt, W-114, HUD_H+24);
  ctx.restore();

// Remembers whether the game was already paused, so closing the panel
// restores that state rather than always resuming.
let settingsWasPaused=false;
function setSettings(v){
  v=!!v;
  if(v && !settingsOpen){
    settingsWasPaused = paused;
    if(GS==='playing') paused = true;
  } else if(!v && settingsOpen){
    if(GS==='playing') paused = settingsWasPaused;
  }
  settingsOpen=v;
  if(!v) settingsPage=0;     // beim naechsten Oeffnen wieder Seite 1
  window._setRects=[];
}

// Eine Zeile des Fensters. Alle Zeilen sehen gleich aus, damit eine neue
// Option nichts weiter braucht als einen Eintrag in der Liste unten.
function setRow(bx, by, bw, bh, label, hint, value, on, act, enabled){
  ctx.fillStyle = enabled ? '#00160c' : '#0a0a0a';
  ctx.fillRect(bx,by,bw,bh);
  ctx.strokeStyle = enabled ? '#4499ff' : '#333'; ctx.lineWidth=1;
  ctx.strokeRect(bx,by,bw,bh);
  ctx.textAlign='left';
  ctx.fillStyle = enabled ? '#7fc4ff' : '#555'; ctx.font='bold 12px Courier New';
  ctx.fillText(label, bx+12, by+7);
  ctx.fillStyle = enabled ? '#007733' : '#3a3a3a'; ctx.font='9px Courier New';
  ctx.fillText(hint, bx+12, by+24);
  ctx.textAlign='right';
  ctx.fillStyle = on ? '#00ee55' : '#666'; ctx.font='bold 12px Courier New';
  ctx.fillText(value, bx+bw-12, by+14);
  if(enabled) window._setRects.push({x:bx,y:by,w:bw,h:bh,act:act});
}

// Zwei Seiten zu vier Zeilen. Acht Zeilen am Stueck waeren 460 von 500
// Bildpunkten Hoehe gewesen.
function settingsRows(){
  if(settingsPage===1) return [
    {label:'RESOLUTION', hint:'canvas scale, lower is cooler but softer',
     value:ECO.res+'x', on:ECO.res!==3, act:'res', enabled:true},
    {label:'BEAM GLOW', hint:'blur around beams, priciest canvas op',
     value:ECO.blur?'OFF':'ON', on:!ECO.blur, act:'blur', enabled:true},
    {label:'RIM LIGHT', hint:'light edge on cruisers and larger',
     value:ECO.rim?'OFF':'ON', on:!ECO.rim, act:'rim', enabled:true},
    {label:'METAL GLINT', hint:'baked highlight map per hull',
     value:ECO.glint?'OFF':'ON', on:!ECO.glint, act:'glint', enabled:true}
  ];
  const avail = fullscreenAvailable();
  return [
    {label:'FULLSCREEN',
     hint:avail?'removes the browser bars and the black edges'
               :'not supported by this browser',
     value:isFullscreen()?'ON':'OFF', on:isFullscreen(),
     act:'fullscreen', enabled:avail},
    {label:'PRACTICE MODE',
     hint:FS1_MODE?'no lives are lost, campaign only'
                  :'campaign only, start with ?fs1=1',
     value:practiceMode?'ON':'OFF', on:practiceMode,
     act:'practice', enabled:FS1_MODE},
    {label:'FRAME RATE', hint:'shows the frame rate below the top bar',
     value:showFps?'ON':'OFF', on:showFps, act:'fps', enabled:true},
    {label:'OBJECT COUNT', hint:'ships / shots / debris, below the rate',
     value:showObj?'ON':'OFF', on:showObj, act:'obj', enabled:true}
  ];
}

function drawSettings(){
  if(!settingsOpen) return;
  window._setRects=[];
  const bw=300, bh=40, gap=8, rows=4;
  const hintH=22;   // room for the closing hint, which used to land inside
                    // the option box because it was not accounted for
  const verH=16;    // eigene Zeile fuer die Versionsnummer, aus demselben
                    // Grund getrennt gerechnet statt in den Hinweis gequetscht
  const navH=24;    // Blaetterzeile, ebenso
  const mw=bw+gap*2, mh=bh*rows+gap*(rows+1)+30+navH+hintH+verH;
  const mx=(W-mw)/2, my=(H-mh)/2;
  ctx.fillStyle='rgba(0,0,0,0.72)'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(0,14,6,0.96)'; ctx.fillRect(mx,my,mw,mh);
  ctx.strokeStyle='#00aa44'; ctx.lineWidth=2; ctx.strokeRect(mx,my,mw,mh);
  ctx.fillStyle='#00ee55'; ctx.font='bold 13px Courier New';
  ctx.textAlign='center'; ctx.textBaseline='top';
  ctx.fillText(settingsPage===1?'ECONOMY':'SETTINGS', mx+mw/2, my+9);

  const bx=mx+gap;
  const list=settingsRows();
  for(let i=0;i<list.length;i++){
    const r=list[i];
    setRow(bx, my+30+gap+i*(bh+gap), bw, bh,
           r.label, r.hint, r.value, r.on, r.act, r.enabled);
  }

  // Blaetterzeile. Zwei Pfeilfelder und die Seitenzahl dazwischen.
  const ny = my+30+gap+rows*(bh+gap);
  ctx.textAlign='center'; ctx.textBaseline='top';
  ctx.fillStyle='#00160c'; ctx.fillRect(bx, ny, 40, 18);
  ctx.fillRect(bx+bw-40, ny, 40, 18);
  ctx.strokeStyle='#4499ff'; ctx.lineWidth=1;
  ctx.strokeRect(bx, ny, 40, 18); ctx.strokeRect(bx+bw-40, ny, 40, 18);
  ctx.fillStyle='#7fc4ff'; ctx.font='bold 12px Courier New';
  ctx.fillText('<', bx+20, ny+3);
  ctx.fillText('>', bx+bw-20, ny+3);
  ctx.fillStyle='#007733'; ctx.font='9px Courier New';
  ctx.fillText('PAGE '+(settingsPage+1)+'/2', mx+mw/2, ny+5);
  window._setRects.push({x:bx, y:ny, w:40, h:18, act:'page'});
  window._setRects.push({x:bx+bw-40, y:ny, w:40, h:18, act:'page'});

  ctx.fillStyle='#005522'; ctx.font='9px Courier New';
  ctx.fillText('FS3  '+GAME_VERSION, mx+mw/2, my+mh-hintH-verH+4);
  ctx.fillStyle='#007733'; ctx.font='9px Courier New';
  ctx.fillText('tap outside or press S to close', mx+mw/2, my+mh-hintH+6);
  ctx.textAlign='left'; ctx.textBaseline='top';
}

// Returns true when the tap was consumed by the panel.
function settingsClick(mx,my){
  if(!settingsOpen) return false;
  const rs=window._setRects||[];
  for(const r of rs){
    if(mx>=r.x&&mx<=r.x+r.w&&my>=r.y&&my<=r.y+r.h){
      if(r.act==='fullscreen') toggleFullscreen();
      else if(r.act==='fps'){ showFps=!showFps; fpsFrames=0; fpsLast=0; }
      else if(r.act==='obj'){ showObj=!showObj; }
      else if(r.act==='practice'){ practiceMode=!practiceMode; }
      else if(r.act==='page'){ settingsPage=settingsPage?0:1; }
      else if(r.act==='res'){
        const _i=ECO_RES_STEPS.indexOf(ECO.res);
        ecoSetRes(ECO_RES_STEPS[(_i+1)%ECO_RES_STEPS.length]);
      }
      else if(r.act==='blur'){ ECO.blur=!ECO.blur; ecoSave(); }
      else if(r.act==='rim'){ ECO.rim=!ECO.rim; ecoSave(); }
      else if(r.act==='glint'){ ECO.glint=!ECO.glint; ecoSave(); }
      return true;
    }
  }
  setSettings(false);
  return true;
}

// Symbole statt Text in der Leiste, gezeichnet wie drawGear() und in
// derselben Palette. Keine Emojis: die kaemen in der Systemschrift und
// wuerden neben Courier und den Schiffssymbolen sofort auffallen.
function drawPauseIcon(cx, cy, col, running){
  ctx.fillStyle=col;
  if(running){                      // laeuft -> zwei Balken zum Anhalten
    ctx.fillRect((cx-5)|0,(cy-7)|0,4,14);
    ctx.fillRect((cx+1)|0,(cy-7)|0,4,14);
  } else {                          // steht -> Dreieck zum Weitermachen
    ctx.beginPath();
    ctx.moveTo(cx-4,cy-7); ctx.lineTo(cx+7,cy); ctx.lineTo(cx-4,cy+7);
    ctx.closePath(); ctx.fill();
  }
}

// Schlank, mit Spitze und drei Finnen.
function drawMissileIcon(cx, cy, col){
  ctx.save(); ctx.translate(cx,cy); ctx.fillStyle=col;
  ctx.beginPath();
  ctx.moveTo(9,0); ctx.lineTo(3,-3); ctx.lineTo(-7,-3);
  ctx.lineTo(-7,3); ctx.lineTo(3,3);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-3,-3); ctx.lineTo(-6,-7); ctx.lineTo(-9,-7); ctx.lineTo(-7,-3);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-3,3); ctx.lineTo(-6,7); ctx.lineTo(-9,7); ctx.lineTo(-7,3);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

// Gedrungen, stumpfe Nase, breites Leitwerk. Auf 34 px Breite muss der
// Unterschied zur Rakete auf einen Blick sitzen, deshalb der dicke Bauch.
function drawBombIcon(cx, cy, col){
  ctx.save(); ctx.translate(cx,cy); ctx.fillStyle=col;
  ctx.beginPath();
  ctx.ellipse(1,0,7.5,5,0,0,Math.PI*2);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-4,-5); ctx.lineTo(-10,-8); ctx.lineTo(-10,8); ctx.lineTo(-4,5);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawHUD(){
  if(GS!=='playing') return;
  var H2=HUD_H,mid=(H2/2)|0;

  // Bar background, fully opaque
  ctx.fillStyle='#000d04';
  ctx.fillRect(0,0,W,H2);
  ctx.fillRect(0,H-8,W,8);
  ctx.strokeStyle='#003311';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(0,H2-1);ctx.lineTo(W,H2-1);ctx.stroke();

  // Font setup
  ctx.textBaseline='middle';

  // ── SCORE ──────────────────────────────────────
  ctx.textAlign='left';
  ctx.fillStyle='#007733';ctx.font='bold 9px Courier New';
  ctx.fillText('SCORE',8,mid-9);
  ctx.fillStyle='#00ee55';ctx.font='bold 15px Courier New';
  ctx.fillText(String(score).padStart(7,'0'),8,mid+5);
  // Third line under the score. The two existing rows sit at 18 and 32 and
  // the bar runs to 54, so there is room here and no need to take up any of
  // the playfield for it.
  ctx.fillStyle='#00693a';ctx.font='bold 8px Courier New';
  ctx.fillText('TIME',8,mid+19);
  ctx.fillStyle=callMenu?'#0a5a33':'#00cc66';ctx.font='bold 10px Courier New';
  ctx.fillText(fmtTime(runTime),34,mid+19);

  // ── WAVE ───────────────────────────────────────
  ctx.fillStyle='#007733';ctx.font='bold 9px Courier New';
  ctx.fillText('WAVE',98,mid-9);
  ctx.fillStyle='#00ee55';ctx.font='bold 15px Courier New';
  ctx.fillText(String(wave).padStart(3,'0'),98,mid+5);
  ctx.fillStyle='#4499ff';
  ctx.font='bold 9px Courier New';
  // Fraktionstext entfernt: er kannte zwei Faelle und schrieb bei HoL
  // "SHIVAN". Welche Fraktion dran ist, sagen Rumpfformen und
  // Triebwerksfarben ohnehin besser als ein Wort in der Leiste.
  // Hier stand der Name des Modifikators. Er verriet die ganze Welle
  // bevor das erste Schiff da war, also genau die Ueberraschung, fuer die
  // es die Modifikatoren gibt. Was los ist, sieht man auf dem Feld.
  // MOD_LABEL bleibt fuer die Fehlersuche stehen.

  // Trenner
  ctx.strokeStyle='#004422';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(178,4);ctx.lineTo(178,H2-4);ctx.stroke();

  // ── HULL ───────────────────────────────────────
  var hx=184,hw=110,hy=7,hh=9;
  var hR=player.hp/player.maxHp;
  ctx.fillStyle='#007733';ctx.font='bold 8px Courier New';ctx.textAlign='left';
  ctx.fillText('HULL',hx,hy+4);
  ctx.fillStyle='#001800';ctx.fillRect(hx,hy+11,hw,hh);
  ctx.globalAlpha=(hR<=HULL_CRIT)?(0.55+0.45*Math.sin(fc*0.22)):1;
  ctx.fillStyle=hullCol(hR);
  ctx.fillRect(hx,hy+11,(hw*hR)|0,hh);
  ctx.globalAlpha=1;
  ctx.strokeStyle='#004422';ctx.lineWidth=1;ctx.strokeRect(hx,hy+11,hw,hh);

  // ── SHIELD ─────────────────────────────────────
  var sy=hy+24;
  var sR=player.sh/player.maxSh;
  ctx.fillStyle='#005566';ctx.font='bold 8px Courier New';
  ctx.fillText('SHIELD',hx,sy+4);
  ctx.fillStyle='#001122';ctx.fillRect(hx,sy+11,hw,hh);
  ctx.fillStyle=sR>.5?'#0099ff':'#0055cc';
  ctx.fillRect(hx,sy+11,(hw*sR)|0,hh);
  ctx.strokeStyle='#003355';ctx.lineWidth=1;ctx.strokeRect(hx,sy+11,hw,hh);
  if(player.shDelay===0&&player.sh<player.maxSh&&fc%30<15){
    ctx.fillStyle='rgba(0,100,200,0.2)';ctx.fillRect(hx,sy+11,hw,hh);
  }

  // Trenner
  ctx.beginPath();ctx.moveTo(306,4);ctx.lineTo(306,H2-4);ctx.stroke();

  // ── LIVES ──────────────────────────────────────
  var lx=312;
  ctx.fillStyle='#007733';ctx.font='bold 8px Courier New';
  ctx.fillText('LIVES',lx,mid-9);
  // Icon follows the hull actually being flown, so switching to a bomber
  // later does not leave a fighter symbol in the bar.
  var lIsB = isBomberHull(player.ship);
  var lIco = ICONS[lIsB?'bomberlives':'fighterlives'];
  // Only four icons fit between the separators at 306 and 406. Beyond that
  // a single icon with a count stays readable where a squeezed row would
  // not.
  var lsy=(mid+2)|0;
  function drawLifeIcon(px){
    if(lIco){
      var lh=15, lw=Math.max(1,Math.round(lIco.width*(lh/lIco.height)));
      ctx.drawImage(lIco, px, (lsy-5)|0, lw, lh);
      return lw;
    }
    ctx.fillStyle='#00ee55';
    ctx.fillRect(px,lsy+2,11,3);ctx.fillRect(px+2,lsy,7,2);
    ctx.fillRect(px+2,lsy+5,7,2);ctx.fillRect(px+9,lsy+2,4,3);
    return 13;
  }
  // One icon and a number at any count. Switching between a row of icons
  // and a number depending on how many are left only made the bar jump.
  var usedW=drawLifeIcon(lx|0);
  ctx.fillStyle='#00ee55'; ctx.font='bold 14px Courier New';
  ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.fillText('x'+lives, lx+usedW+5, lsy+2);

  // Trenner
  ctx.beginPath();ctx.moveTo(406,4);ctx.lineTo(406,H2-4);ctx.stroke();

  // ── SEC WEAPON BUTTON ──────────────────────────
  // Waren 80 px Text. Ein Symbol mit der Restmunition darunter leistet
  // dasselbe auf 34, und der frei werdende Streifen ist der Platz fuer die
  // naechsten Buttons. Der Bomber bekommt ein eigenes Symbol, weil ein
  // Raketensymbol auf einem Schiff ohne Raketen schlicht falsch ist.
  var secX=412,secBW=34,secBH=H2-10,secBY=5;
  var isMissile=player.secType==='missile';
  var secRdy=player.secTimer===0&&player.secAmmo>0;
  var secClr=isMissile?'#ff8800':'#cc2200';
  ctx.fillStyle=secRdy?'#001800':'#0a0a0a';
  ctx.fillRect(secX,secBY,secBW,secBH);
  ctx.strokeStyle=secRdy?secClr:'#333';ctx.lineWidth=1;
  ctx.strokeRect(secX,secBY,secBW,secBH);
  if(isMissile) drawMissileIcon(secX+secBW/2,secBY+13,secRdy?secClr:'#444');
  else          drawBombIcon(secX+secBW/2,secBY+13,secRdy?secClr:'#444');
  ctx.fillStyle=secRdy?secClr:'#555';ctx.font='bold 13px Courier New';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(String(player.secAmmo).padStart(2,'0'),secX+secBW/2,secBY+31);
  if(player.secTimer>0){
    var cdMax=isMissile?45:90,cdW=secBW-8;
    ctx.fillStyle='#111';ctx.fillRect(secX+4,secBY+secBH-6,cdW,3);
    ctx.fillStyle=secClr;ctx.fillRect(secX+4,secBY+secBH-6,(cdW*(1-player.secTimer/cdMax))|0,3);
  }
  // Grundzustand fuer die folgenden Felder wiederherstellen: die standen
  // vorher auf left/middle und lesen ihn nicht selbst.
  ctx.textAlign='left';ctx.textBaseline='middle';
  window._secBtnRect={x:secX,y:secBY,w:secBW,h:secBH};

  // Trenner
  ctx.strokeStyle='#004422';
  ctx.beginPath();ctx.moveTo(449,4);ctx.lineTo(449,H2-4);ctx.stroke();

  // ── SUPPORT ─────────────────────────────
  var alX=455, alBW=76, alBH=H2-10, alBY=5;
  var alRdy=allyReady();
  ctx.fillStyle=alRdy?'#001800':'#0a0a0a';
  ctx.fillRect(alX,alBY,alBW,alBH);
  ctx.strokeStyle=alRdy?'#00ee55':'#333';ctx.lineWidth=1;
  ctx.strokeRect(alX,alBY,alBW,alBH);
  ctx.textAlign='left';
  ctx.fillStyle='#007733';ctx.font='bold 8px Courier New';
  ctx.fillText('SUPPORT',alX+4,alBY+9);
  ctx.fillStyle=alRdy?'#00ee55':'#555';ctx.font='bold 11px Courier New';
  ctx.fillText(alRdy?(anyTicket()?'READY':'NO TICKET'):(allies.length?'DEPLOYED':'STANDBY'),
               alX+4,alBY+26);
  ctx.fillStyle='#333';ctx.font='7px Courier New';
  ctx.fillText('TAP / [C]',alX+4,alBY+alBH-7);
  window._allyBtnRect={x:alX,y:alBY,w:alBW,h:alBH};

  // The escort panel is gone: every capital ship carries its own bar over
  // the hull, so the panel repeated one number and took the only strip of
  // the bar wide enough for the ticket counters.
  {
    // Two by two. The class icons run 34 to 50 px wide at 14 px high and
    // there are only 158 px between here and the pause button, so a single
    // row of four cannot work.
    // Narrower than before to free the strip the settings button needs.
    var tkX=537, tkY=3, tkW=64, tkH=24;
    for(var ti=0;ti<TICKET_ORDER.length;ti++){
      var tk=TICKET_ORDER[ti], tn=tickets[tk]||0;
      var lit=tn>0;
      var fresh=(ticketFlash>0 && ticketFlashKind===tk && fc%16<10);
      var col=fresh?'#ffffff':(lit?'#7fd8ff':'#243642');
      var tico=ICONS[TICKET_ICON[tk]];
      var tcx=tkX+(ti%2)*tkW, tcy=tkY+((ti/2)|0)*tkH;
      ctx.textAlign='left'; ctx.textBaseline='top';
      // Count first, then the icon. With the icon leading, the digits sat
      // at a different offset in every row, because the class symbols are
      // 30 to 43 px wide. This way the numbers form a clean column.
      ctx.fillStyle=col; ctx.font='bold 13px Courier New';
      ctx.fillText(tn+'x',tcx,tcy+5);
      var icoX=tcx+21;
      if(tico){
        ctx.globalAlpha=lit?1:0.28;
        var th=11, tiw=Math.max(1,Math.round(tico.width*(th/tico.height)));
        ctx.drawImage(tico,icoX,tcy+5,tiw,th);
        ctx.globalAlpha=1;
      } else {
        ctx.fillStyle=col; ctx.font='bold 10px Courier New';
        ctx.fillText(TICKET_ABBR[tk],icoX,tcy+6);
      }
    }
  }

  // ── SHIP SWITCH BUTTON ─────────────────────────
  // In the gap between the ticket grid (ends at 665) and the gear.
  if(!FS1_MODE){
    var swW=22, swH=H2-8, swX=Math.round((665+W-52)/2-swW/2), swY=4;
    var swOn=shipSwapReady()||shipMenu;
    ctx.fillStyle=shipMenu?'#553b00':(swOn?'#221800':'#0a0a0a');
    ctx.fillRect(swX,swY,swW,swH);
    ctx.strokeStyle=swOn?'#ffbb22':'#333'; ctx.lineWidth=2;
    ctx.strokeRect(swX,swY,swW,swH);
    drawSwapIcon(swX+swW/2, swY+swH/2, swOn?'#ffbb22':'#444');
    window._shipBtnRect={x:swX,y:swY,w:swW,h:swH};
  } else window._shipBtnRect=null;

  // ── PAUSE BUTTON ───────────────────────────────
  // ── SETTINGS ───────────────────────────────────
  // Its own button rather than an entry somewhere, because more options
  // are going to live behind it.
  var stbX=W-52,stbY=4,stbW=22,stbH=H2-8;
  ctx.fillStyle=settingsOpen?'#005522':'#002211';
  ctx.fillRect(stbX,stbY,stbW,stbH);
  ctx.strokeStyle='#00ee55';ctx.lineWidth=2;
  ctx.strokeRect(stbX,stbY,stbW,stbH);
  drawGear(stbX+stbW/2, stbY+stbH/2, 7, '#00ee55');
  window._settingsBtnRect={x:stbX,y:stbY,w:stbW,h:stbH};

  // 22 px wie das Zahnrad daneben, Symbol statt Wort. Zwischen dem
  // Ticketraster und dem Zahnrad bleiben damit rund 82 px frei.
  var pbX=W-26,pbY=4,pbW=22,pbH=H2-8;
  ctx.fillStyle=paused?'#005522':'#002211';
  ctx.fillRect(pbX,pbY,pbW,pbH);
  ctx.strokeStyle='#00ee55';ctx.lineWidth=2;
  ctx.strokeRect(pbX,pbY,pbW,pbH);
  drawPauseIcon(pbX+pbW/2,pbY+pbH/2,'#00ee55',!paused);
  window._pauseBtnRect={x:pbX,y:pbY,w:pbW,h:pbH};

  ctx.textAlign='left';ctx.textBaseline='top';
}

// ── CALL MENU ──────────────────────────────────────────────────
// The game pauses while the menu is open, otherwise
// picking on a tablet would be a blind guess mid-fight.
// ── SHIP SWITCH ──────────────────────────────────────────────
// Stats for any hull. Hulls outside PLAYER_SHIPS (the FS1 roster) get the
// old fighter or bomber defaults.
function isBomberHull(key){ return hullClass(key)==='bo'; }
function shipStats(key){
  for(const s of PLAYER_SHIPS) if(s.key===key) return s;
  const b = isBomberHull(key);
  return {key:key, name:key, spd:b?PLAYER_SPD_BOMBER:PLAYER_SPD_FIGHTER, turn:PLAYER_TURN,
          hp:100, sh:100, sec:b?10:20};
}
// Puts the player into a hull with everything refilled.
function applyShip(key){
  const s = shipStats(key);
  player.ship   = key;
  player.spd    = s.spd;
  player.turn   = s.turn;
  player.baseHp = s.hp;
  player.maxHp  = Math.round(s.hp*(player.hullMult||1));
  player.hp     = player.maxHp;
  player.maxSh  = s.sh;
  resetPlayerShield();
  player.secMax = s.sec;
  player.secAmmo= s.sec;
  player.secType= isBomberHull(key) ? 'bomb' : 'missile';
}
// Unlocks follow the score within a run. Several thresholds can fall in
// one step, e.g. after a big bonus, so this loops.
function tickShipUnlocks(){
  if(GS!=='playing' || FS1_MODE) return;
  while(shipUnlocked < PLAYER_SHIPS.length && score >= PLAYER_SHIPS[shipUnlocked].unlock){
    const s = PLAYER_SHIPS[shipUnlocked++];
    SUB_MSGS.push({x:W/2, y:H*0.34, txt:s.name.toUpperCase()+' AVAILABLE', life:260, ml:260, ally:true});
  }
}
// The switch lands from an allied destroyer's hangar, so one has to be on
// the field. The campaign mode assigns its hulls itself.
function shipSwapReady(){
  if(GS!=='playing' || FS1_MODE || inJump()) return false;
  if(shipSwapWave===wave || shipUnlocked<2) return false;
  for(const a of allies)

function drawSwapIcon(cx, cy, col){

  ctx.beginPath(); ctx.moveTo(cx+6,cy+3); ctx.lineTo(cx-3,cy+3); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx-7,cy+3); ctx.lineTo(cx-2,cy-0.5); ctx.lineTo(cx-2,cy+6.5); ctx.closePath(); ctx.fill();

// Filled pips for a value against its steps, so players compare hulls
// without reading raw numbers.
function statPips(x, y, v, steps, lit){
  let n = 0; for(const s of steps) if(v>=s-1e-9) n++;
  for(let i=0;i<steps.length;i++){
    ctx.fillStyle = i<n ? lit : '#1c2a22';
    ctx.fillRect(x+i*7, y, 5, 5);
  }
}

// Shared handling for mouse and touch. Returns true when the
// pointer was handled and the caller should stop.
function pointerConsumed(p){
  if(GS!=='playing') return false;
  if(shipMenu){
    for(const r of (window._shipRects||[]))
      if(p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h){ if(r.key) swapShip(r.key); return true; }
    setShipMenu(false); return true;
  }
  var rsw=window._shipBtnRect;
  if(rsw&&p.x>=rsw.x&&p.x<=rsw.x+rsw.w&&p.y>=rsw.y&&p.y<=rsw.y+rsw.h){ toggleShipMenu(); return true; }
  if(callMenu){
    if(window._callRects){
      for(var ci=0;ci<window._callRects.length;ci++){
        var cr=window._callRects[ci];
        if(p.x>=cr.x&&p.x<=cr.x+cr.w&&p.y>=cr.y&&p.y<=cr.y+cr.h){
          // The menu stays open after refining, so several can be done in
          // a row without reopening it each time.
          if(cr.refine){ refineTicket(cr.refine); return true; }
          callAlly(cr.id); return true;
        }
      }
    }
    setCallMenu(false); return true;
  }
  var ra=window._allyBtnRect;
  if(ra&&p.x>=ra.x&&p.x<=ra.x+ra.w&&p.y>=ra.y&&p.y<=ra.y+ra.h){ toggleCallMenu(); return true; }
  return false;
}





function drawTitle(){
  ctx.fillStyle='rgba(0,0,8,0.78)';ctx.fillRect(0,0,W,H);
  drawStars();

  // Logo size
  const lw=Math.min(420,W*0.52)|0;
  const lh=(lw*0.765)|0;

  // "3" matches the letter height in the logo (about 28% of logo height)
  const fs3=Math.round(lh*0.28);
  ctx.font='bold italic '+fs3+'px Impact,Arial Black,sans-serif';
  const w3=ctx.measureText('3').width+2;

  // Logo + "3" gemeinsam horizontal zentrieren
  const totalW=lw+w3;
  const lx=Math.round((W-totalW)/2);
  const ly=14; // oberer Rand

  // White removal on the canvas side
  const fsLogo=document.getElementById('fs_logo');
  if(fsLogo&&fsLogo.complete&&fsLogo.naturalWidth>0){
    // Draw into an offscreen canvas and process the pixels
    if(!window._logoProcessed){
      const oc=document.createElement('canvas');
      oc.width=fsLogo.naturalWidth; oc.height=fsLogo.naturalHeight;
      const oc2=oc.getContext('2d');
      oc2.drawImage(fsLogo,0,0);
      try{
        const id=oc2.getImageData(0,0,oc.width,oc.height);
        const d=id.data;
        for(var i=0;i<d.length;i+=4){
          var r=d[i],g=d[i+1],b=d[i+2];
          var mx=Math.max(r,g,b),mn=Math.min(r,g,b);
          var sat=mx>0?(mx-mn)/mx:0;
          var val=mx/255;
          // White and grey: bright and unsaturated becomes transparent
          if(val>0.60&&sat<0.40){
            var w=(val-0.60)/0.40*(1-sat/0.40);
            d[i+3]=Math.round(Math.max(0,1-w)*255);
          }
        }
        oc2.putImageData(id,0,0);
        window._logoProcessed=oc;
      }catch(e){ window._logoProcessed=fsLogo; }
    }
    ctx.drawImage(window._logoProcessed,lx,ly,lw,lh);
  }

  // "3" sits to the right, aligned to the cap height of the letters
  // In the original the "2" sits at roughly 18-80% of the logo height
  const tx=lx+lw+2;
  const ty=ly+Math.round(lh*0.75); // Baseline

  ctx.textAlign='left';ctx.textBaseline='alphabetic';
  ctx.font='bold italic '+fs3+'px Impact,Arial Black,sans-serif';
  ctx.strokeStyle='#0a0000';ctx.lineWidth=fs3*0.14;ctx.lineJoin='round';
  ctx.strokeText('3',tx,ty);
  ctx.strokeStyle='#3a0000';ctx.lineWidth=fs3*0.06;
  ctx.strokeText('3',tx,ty);
  var g3=ctx.createLinearGradient(tx,ty-fs3,tx,ty);
  g3.addColorStop(0,'#ff4422');
  g3.addColorStop(0.4,'#dd1100');
  g3.addColorStop(1,'#770000');
  ctx.fillStyle=g3;
  ctx.fillText('3',tx,ty);

  // Subtitle + Controls
  const infoY=ly+lh+18;
  ctx.textAlign='center';ctx.textBaseline='top';
  ctx.fillStyle='#886655';ctx.font='12px Courier New';
  ctx.fillText('A Hard Light Productions Mini-Game',W/2,infoY);
  ctx.fillStyle='#333344';ctx.fillRect(W/2-180,infoY+18,360,1);
  ctx.fillStyle='#aaaacc';ctx.font='12px Courier New';
  ctx.fillText('Move mouse to steer   |   Hold to fire lasers',W/2,infoY+26);
  ctx.fillStyle='#6666aa';ctx.font='10px Courier New';
  ctx.fillText('Right-click -- Secondary weapon  (touch: SEC button)',W/2,infoY+42);
  if(fc%80<55){
    ctx.fillStyle='#ffffff';ctx.font='bold 13px Courier New';
    ctx.fillText('[ PRESS SPACE OR ENTER ]',W/2,infoY+60);
  }
}

var isFiring = false;

function toGC(clientX, clientY) {
  var r = CVS.getBoundingClientRect();
  return { x:(clientX-r.left)*(W/r.width), y:(clientY-r.top)*(H/r.height) };
}


// Maus
CVS.addEventListener('mousedown',function(ev){
  if(ev.button===0&&GS==='playing'){
    var p=toGC(ev.clientX,ev.clientY);
    if(pointerConsumed(p)) return;
    // The settings panel eats the tap before anything else can react to it,
    // or opening it would also fire a weapon underneath.
    if(settingsOpen){ settingsClick(p.x,p.y); return; }
    if(window._settingsBtnRect){var rs=window._settingsBtnRect;if(p.x>=rs.x&&p.x<=rs.x+rs.w&&p.y>=rs.y&&p.y<=rs.y+rs.h){setSettings(true);return;}}
    if(window._pauseBtnRect){var r=window._pauseBtnRect;if(p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h){paused=!paused;return;}}
    if(window._secBtnRect){var r2=window._secBtnRect;if(p.x>=r2.x&&p.x<=r2.x+r2.w&&p.y>=r2.y&&p.y<=r2.y+r2.h){fireSecondary();return;}}
    if(p.y<HUD_H) return; // HUD area, no movement input
  }
  if(ev.button!==0&&ev.button!==2) return;
  var p=toGC(ev.clientX,ev.clientY);
  MOUSE.x=p.x; MOUSE.y=p.y;
  if(ev.button===0){
    isFiring=true; MOUSE.down=true;
    if(GS==='title'||GS==='gameover'){ if(GS==='title'||performance.now()-gameOverAt>1500) launchGame(); }
  }
  if(ev.button===2&&GS==='playing') fireSecondary();
});

  var rdy=player.secTimer===0&&player.secAmmo>0;
  btn.style.opacity=rdy?'1':'0.4';
  btn.style.background=rdy?(player.secType==='missile'?'rgba(180,60,0,0.9)':'rgba(120,0,0,0.9)'):'rgba(50,50,50,0.7)';
}

// Keyboard
document.addEventListener('keydown',function(ev){
  K[ev.code]=true;
  // S opens and closes the panel, Escape closes it before it reaches pause.
  if(ev.code==='KeyS' && !callMenu && !shipMenu && GS==='playing'){
    setSettings(!settingsOpen); ev.preventDefault(); return;
  }
  if(settingsOpen && ev.code==='Escape'){ setSettings(false); ev.preventDefault(); return; }
  if(ev.code==='KeyF' && GS==='playing'){
    toggleFullscreen(); ev.preventDefault(); return;
  }
  if((ev.code==='KeyP'||ev.code==='Escape')&&GS==='playing'){
    paused=!paused; ev.preventDefault();
  }
  if((GS==='title'||GS==='gameover')&&(ev.code==='Space'||ev.code==='Enter')){ if(GS==='title'||performance.now()-gameOverAt>1500) launchGame(); }
});
document.addEventListener('keyup',function(ev){K[ev.code]=false;});

// Request support
document.addEventListener('keydown',function(ev){
  if(GS!=='playing') return;
  if(ev.code==='KeyV'){ toggleShipMenu(); ev.preventDefault(); return; }
  if(shipMenu){
    if(ev.code==='Escape'){ setShipMenu(false); ev.preventDefault(); return; }
    var sd = ev.code.indexOf('Digit')===0 ? ev.code.slice(5) : (ev.code.indexOf('Numpad')===0 ? ev.code.slice(6) : '');
    var si = parseInt(sd,10);
    if(si>=1 && si<=PLAYER_SHIPS.length){ swapShip(PLAYER_SHIPS[si-1].key); ev.preventDefault(); }
    return;
  }
  if(ev.code==='KeyC'){ toggleCallMenu(); ev.preventDefault(); return; }
  if(ev.code==='Escape' && callMenu){ setCallMenu(false); ev.preventDefault(); return; }
  if(callMenu){
    // Eleven entries no longer fit on the number row alone, so the second
    // column sits on the keys directly above it.
    var ch='';
    if(ev.code.indexOf('Digit')===0)  ch=ev.code.slice(5);
    else if(ev.code.indexOf('Numpad')===0) ch=ev.code.slice(6);
    else if(ev.code.indexOf('Key')===0)    ch=ev.code.slice(3);
    if(ch===ALLY_SPECIAL_KEY){ callAlly(ALLY_SPECIAL); ev.preventDefault(); return; }
    const ki=ALLY_KEYS.indexOf(ch);
    if(ki>=0){ callAlly(ALLY_ORDER[ki]); ev.preventDefault(); }
  }
});


let lastErr='';

// ── FIXED TIME STEP ───────────────────────────────────────────
// update() counts in whole frames. Without a cap the game runs on a
// 144 Hz display runs 2.4x faster than on 60 Hz, so the simulation is
// pinned to a fixed step rate, while drawing still happens as often
// as the display allows.
// Game speed. Every velocity, fire rate and beam timing in the game
// count in whole simulation steps, so TICK_HZ is the single dial for
// overall pace. 100 tested best.
// build_game.py can override this value with --hz.
const TICK_HZ = 100;
const TICK_MS = 1000/TICK_HZ;
const MAX_CATCHUP = 6;     // catch up at most 6 steps per frame
let _acc = 0, _prev = 0;

function stepUpdate(){
  try{update();}
  catch(e){if(e.message!==lastErr){console.error('Update error:',e);lastErr=e.message;}}
}

(function loop(now){
  requestAnimationFrame(loop);
  if(typeof now !== 'number') now = (typeof performance !== 'undefined' ? performance.now() : Date.now());
  if(!_prev){ _prev = now; stepUpdate(); }
  else {
    let dt = now - _prev;
    _prev = now;
    // After a tab switch or sleep, do not catch up for minutes
    if(dt > 250) dt = TICK_MS;
    _acc += dt;
    let steps = 0;
    while(_acc >= TICK_MS && steps < MAX_CATCHUP){
      stepUpdate();
      _acc -= TICK_MS;
      steps++;
    }
    if(steps >= MAX_CATCHUP) _acc = 0;
  }
  try{draw();}catch(e){if(e.message!==lastErr){console.error('Draw error:',e);lastErr=e.message;}}
  try{drawCallMenu();}catch(e){}
  try{drawShipMenu();}catch(e){}
  try{drawCtxNotice();}catch(e){}
})();

</script>
