<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>FreeSpace 3</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:'Courier New',monospace;user-select:none;-webkit-user-select:none;touch-action:none}
.nocursor canvas{cursor:none}
/* Position and size are set from applyResolution, which fits the canvas
   to the viewport without changing its aspect ratio and centres it. The
   body's black shows through wherever a screen's ratio does not match. */
canvas{display:block;position:fixed;top:0;left:0}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="launchBtn" onclick="launchGame()" style="
  display:none;position:fixed;bottom:40px;left:50%;transform:translateX(-50%);
  background:rgba(0,60,30,0.95);color:#00ff88;border:2px solid #00ff88;
  padding:12px 48px;font-family:'Courier New',monospace;font-size:18px;
  cursor:pointer;letter-spacing:2px;z-index:10;
  box-shadow:0 0 20px rgba(0,255,136,0.3);">
  [ LAUNCH ]
</button>
<button id="secBtn" ontouchstart="secBtnDown(event)" ontouchend="secBtnUp(event)"
  onmousedown="secBtnDown(event)" onmouseup="secBtnUp(event)" style="
  display:none;position:fixed;bottom:24px;right:24px;
  width:90px;height:90px;border-radius:50%;
  background:rgba(180,60,0,0.85);color:#ffaa00;border:2px solid #ff8800;
  font-family:'Courier New',monospace;font-size:11px;font-weight:bold;
  cursor:pointer;z-index:999;touch-action:none;-webkit-tap-highlight-color:transparent;
  box-shadow:0 0 15px rgba(255,100,0,0.4);">
  SEC<br>FIRE
</button>
<img id="fs_logo" src="@@FS3_ASSET:images/fs_logo.png@@" style="display:none">
<img id="warp_img" src="@@FS3_ASSET:images/warp_img.webp@@" style="display:none">
<img id="hull_img" src="@@FS3_ASSET:images/hull_img.png@@" style="display:none">
<script>
const SPR_DATA={};

const NEB_DATA={
  'Aldebaran':'@@FS3_ASSET:nebulae/Aldebaran.jpg@@',
  'AlphaCentauri':'@@FS3_ASSET:nebulae/AlphaCentauri.jpg@@',
  'BeAquilae':'@@FS3_ASSET:nebulae/BeAquilae.jpg@@',
  'DSerpentis':'@@FS3_ASSET:nebulae/DSerpentis.jpg@@',
  'Deneb':'@@FS3_ASSET:nebulae/Deneb.jpg@@',
  'R128':'@@FS3_ASSET:nebulae/R128.jpg@@',
  'Sirius':'@@FS3_ASSET:nebulae/Sirius.jpg@@',
  'Vasuda':'@@FS3_ASSET:nebulae/Vasuda.jpg@@',
  'Vega':'@@FS3_ASSET:nebulae/Vega.jpg@@',
};

// LORE: Die SD Hades stammt aus Silent Threat: Reborn und ist kanonisch
// KEIN NTF-Schiff. Sie steht in ntf_super, weil die NTF sonst kein Schiff
// haette, das als Boss taugt - eine bewusste Freiheit des Autors, keine
// Verwechslung. Bitte nicht umsortieren.
// Der Kommentar steht ausserhalb von ROLES, weil referenced_keys() im
// Packer jeden Ausdruck in Anfuehrungszeichen innerhalb des Blocks als
// Schiffsschluessel liest.
const ROLES={"player_fighters": ["fiares", "fierinyes", "fiherc", "fihercmk2", "fimyrmidon", "fipegasus"], "player_bombers": ["boartemis", "boartemisdh", "boboanerges", "bomedusa", "boursa"], "ntf_fighters": ["fiherc", "fihercmk2", "fimyrmidon", "filoki"], "ntf_bombers": ["boartemis", "boboanerges", "bomedusa", "boursa", "bozeus"], "ntf_cruisers": ["ntfcraeolus", "ntfcrleviathan", "ntfcrfenris"], "ntf_corvette": ["ntfcodeimos"], "ntf_destroyers": ["ntfdeorion", "ntfdehecate"], "ntf_super": ["sdhades"], "shivan_fighters": ["fiaeshma", "fiastaroth", "fibasilisk", "fidragon", "fimanticore", "fimara"], "shivan_bombers": ["bonahema", "bonephilim", "boseraphim", "botaurvi"], "shivan_cruisers": ["crcain", "crlilith", "crrakshasa"], "shivan_corvette": ["comoloch"], "shivan_destroyers": ["dedemon", "deravana"], "shivan_super": ["sdlucifer", "sdsathanas"], "ally_ter_fighters": ["fiares", "fierinyes", "fiherc", "fihercmk2", "fimyrmidon", "fipegasus"], "ally_ter_bombers": ["boartemis", "boartemisdh", "boboanerges", "bomedusa", "boursa"], "ally_ter_cruisers": ["craeolus", "crleviathan", "crfenris"], "ally_ter_corvette": ["codeimos"], "ally_ter_destroyers": ["deorionright"], "ally_vas_fighters": ["fihorus", "fiptah", "fiserapis", "fiseth", "fitauret", "fitoth"], "ally_vas_bombers": ["bobakha", "boosiris", "bosekhmet"], "ally_vas_cruisers": ["craten", "crmentu"], "ally_vas_corvette": ["cosobek"], "ally_vas_destroyers": ["detyphon", "dehatshepsut"], "bonus_ally": ["sdcolossus"], "bonus_enemy": ["coiceni"]};

const NEB_NAMES=["Aldebaran", "AlphaCentauri", "BeAquilae", "DSerpentis", "Deneb", "R128", "Sirius", "Vasuda", "Vega"];


const CVS=document.getElementById('c');
const ctx=CVS.getContext('2d');
const W=800,H=500,HUD_H=54;

// The canvas holds a fixed 800x500 coordinate space, but CSS stretches it
// across the whole viewport. Without a matching backing store every pixel
// gets upscaled, which is why text used to look smeared. We size the
// backing store to real device pixels and scale the context instead, so
// all game code keeps working in the original 800x500 units.
// ECO: vier einzeln schaltbare Posten gegen die Ueberhitzung des
// Testgeraets. Bewusst KEIN Sammelschalter - ein Sammelschalter sagt
// hinterher nur, dass es besser wurde, nicht welcher Posten es war.
//   res    Zeichenflaeche. Auf einem 1280x800-Tablet mit
//          Geraetepixelverhaeltnis 2 ergibt 3 eine Flaeche von 2400x1500,
//          also 3,6 Millionen Bildpunkte je Bild. 1.5 sind 0,9 Millionen.
//   blur   shadowBlur im Strahlenzeichner, je Strahl je Bild.
//   rim    drawRimLight, 640er Puffer mit drei Kompositdurchgaengen je
//          Grosskampfschiff je Bild.
//   glint  gebackene Glanzkarten und Schildhaeute. Wachsen mit jedem neuen
//          Rumpftyp, den man zu Gesicht bekommt - passt zum Muster
//          "erst in spaeteren Wellen".
// Der Stand wird gemerkt, damit nach einem Schwarzwerden nicht alles neu
// gestellt werden muss. Uebungsmodus und Anzeigen bewusst nicht.
const ECO_RES_STEPS = [3, 2, 1.5];
// Voreinstellung sparsam. Auf einem 1280x800-Tablet mit
// Geraetepixelverhaeltnis 2 kostet res 3 eine Flaeche von 3,6 Millionen
// Bildpunkten je Bild und macht das Geraet nach laengeren Sitzungen heiss;
// bei 1.5 sind es 0,9 Millionen. true heisst hier AUS.
// Wer schon einmal gespielt hat, behaelt seine eigene Wahl - der
// gespeicherte Stand ueberschreibt diese Zeile weiter unten.
let ECO = {res:1.5, blur:true, rim:true, glint:true};
try{
  const _es = localStorage.getItem('fs3_eco');
  if(_es){
    const _eo = JSON.parse(_es);
    if(_eo && typeof _eo === 'object'){
      if(ECO_RES_STEPS.indexOf(_eo.res) >= 0) ECO.res = _eo.res;
      ECO.blur = !!_eo.blur; ECO.rim = !!_eo.rim; ECO.glint = !!_eo.glint;
    }
  }
}catch(ex){}
function ecoSave(){
  try{ localStorage.setItem('fs3_eco', JSON.stringify(ECO)); }catch(ex){}
}
// Eine Stelle, an der die Weichzeichnung abgeschaltet wird. Sechs
// verstreute Abfragen waeren sechs Gelegenheiten, eine zu vergessen.
function ecoBlur(v){ return ECO.blur ? 0 : v; }

let MAX_RES = ECO.res;      // cap so 4K screens do not allocate absurd canvases
let RES_X = 1, RES_Y = 1;

// One scale for both axes. Two independent scales are what squashed the
// picture as soon as the logical canvas stopped matching the screen's
// ratio. The element is sized and centred here rather than in CSS, so
// getBoundingClientRect returns exactly the drawn area and every pointer
// conversion in the file keeps working unchanged.
// The fullscreen API only answers to a genuine user gesture, which is why
// this hangs off buttons rather than being applied automatically.
function isFullscreen(){
  return !!(document.fullscreenElement || document.webkitFullscreenElement);
}
function fullscreenAvailable(){
  const el = document.documentElement;
  return !!(el.requestFullscreen || el.webkitRequestFullscreen);
}
function toggleFullscreen(){
  try{
    if(isFullscreen()){
      if(document.exitFullscreen) document.exitFullscreen();
      else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
    } else {
      const el = document.documentElement;
      if(el.requestFullscreen) el.requestFullscreen();
      else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    }
  }catch(ex){}
  // The viewport changes a moment after the switch, not during it.
  setTimeout(applyResolution, 120);
  setTimeout(applyResolution, 500);
}

function applyResolution(){
  const availW = window.innerWidth  || 800;
  const availH = window.innerHeight || 500;
  const fit = Math.min(availW/W, availH/H);
  const cssW = Math.max(1, Math.round(W*fit));
  const cssH = Math.max(1, Math.round(H*fit));
  CVS.style.width  = cssW+'px';
  CVS.style.height = cssH+'px';
  CVS.style.left = Math.round((availW-cssW)/2)+'px';
  CVS.style.top  = Math.round((availH-cssH)/2)+'px';
  const dpr = window.devicePixelRatio || 1;
  const res = Math.max(1, Math.min(MAX_RES, cssW*dpr/W));
  RES_X = res; RES_Y = res;
  CVS.width  = Math.round(W*RES_X);
  CVS.height = Math.round(H*RES_Y);
  ctx.setTransform(RES_X, 0, 0, RES_Y, 0, 0);
  ctx.imageSmoothingEnabled = true;
  if('imageSmoothingQuality' in ctx) ctx.imageSmoothingQuality = 'high';
}

// CVS.width = ... setzt die Transformation zurueck; applyResolution setzt
// sie unmittelbar danach wieder. Ein einziger Aufruf reicht also.
function ecoSetRes(v){
  ECO.res = v; MAX_RES = v; ecoSave(); applyResolution();
}

applyResolution();
window.addEventListener('resize', applyResolution);
// A toolbar sliding in or out changes the visual viewport without always
// firing a window resize, which would leave the canvas the wrong height.
if(window.visualViewport){
  window.visualViewport.addEventListener('resize', applyResolution);
  window.visualViewport.addEventListener('scroll', applyResolution);
}
document.addEventListener('fullscreenchange', function(){ setTimeout(applyResolution, 60); });
document.addEventListener('webkitfullscreenchange', function(){ setTimeout(applyResolution, 60); });
window.addEventListener('orientationchange', function(){ setTimeout(applyResolution, 150); });

// A 2D context is not guaranteed to survive. Chromium on Android drops
// the backing store when the GPU process runs short of memory and hands
// back a context reset to defaults: identity transform, empty save stack.
// Calling preventDefault on contextlost asks the browser to restore it,
// and applyResolution puts the device pixel scale back afterwards.
// Sprites and alpha masks are unaffected, they live outside the canvas.
let ctxRestores = 0, ctxNoticeUntil = 0;
CVS.addEventListener('contextlost', function(ev){ ev.preventDefault(); }, false);
CVS.addEventListener('contextrestored', function(){
  ctxRestores++;
  ctxNoticeUntil = Date.now() + 6000;
  applyResolution();
}, false);
document.addEventListener('visibilitychange', function(){
  if(!document.hidden) applyResolution();
});

// Diagnostic only: shows for six seconds that a restore happened, so the
// event can be confirmed on a tablet without a console.
function drawCtxNotice(){
  if(!ctxNoticeUntil || Date.now() > ctxNoticeUntil) return;
  ctx.save();
  ctx.globalAlpha = 0.85;
  ctx.fillStyle = '#ffcc00';
  ctx.font = '10px Courier New';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'bottom';
  ctx.fillText('CTX RESTORED x' + ctxRestores, 6, H - 4);
  ctx.restore();
}
window.addEventListener('orientationchange', function(){ setTimeout(applyResolution, 120); });

// Filled by the packer from the icons folder. Left empty the HUD falls
// back to the symbols it draws itself, so the game still runs unpacked.
const ICON_DATA={};

// Hintergrundkoerper, vom Packer aus den Ordnern planets/ und suns/
// gefuellt. Format je Eintrag: {src, cx, cy, r}. Bei r > 0 ist das Bild
// ein JPEG ohne Alphakanal und die Scheibe wird beim Zeichnen als Kreis
// ausgeschnitten - der Alphakanal eines Planeten ist eine Kreisscheibe
// und damit nichts, was man speichern muesste. Bei r == 0 hat das Bild
// einen echten Alphakanal und wird unveraendert gezeichnet; das gilt fuer
// die Sonnen mit ihrer weichen Korona und fuer den Ringplaneten, dessen
// Ring ein Kreisschnitt abschneiden wuerde.
const PLANET_DATA={};
const SUN_DATA={};

// ── ASSET LOADING ─────────────────────────────────────────────
const IMGS={},NEBS={},ICONS={};
let imgsLoaded=0,nebsLoaded=0,iconsLoaded=0;
for(const [k,src] of Object.entries(ICON_DATA)){
  const img=new Image();img.onload=()=>{ICONS[k]=img;iconsLoaded++;};img.src=src;}
for(const [k,src] of Object.entries(SPR_DATA)){
  const img=new Image();img.onload=()=>{IMGS[k]=img;imgsLoaded++;if(typeof buildMask==='function')buildMask(k);};img.src=src;}
for(const [k,src] of Object.entries(NEB_DATA)){
  const img=new Image();img.onload=()=>{NEBS[k]=img;nebsLoaded++;};img.src=src;}
const BODY_IMG={};
for(const [k,b] of Object.entries(PLANET_DATA)){
  const img=new Image();img.onload=()=>{BODY_IMG[k]=img;};img.src=b.src;}
for(const [k,b] of Object.entries(SUN_DATA)){
  const img=new Image();img.onload=()=>{BODY_IMG[k]=img;};img.src=b.src;}
const TOTAL=Object.keys(SPR_DATA).length+Object.keys(NEB_DATA).length;
const WARP_IMG=document.getElementById('warp_img');
// The vortex used to be an animated WebP. Whether a browser advances the
// frames of an image it is not showing is up to the browser, and it is
// one shared timeline for every vortex on the field either way. The same
// file is now baked into a frame sheet at build time and the frame is
// picked from each ship's own warp progress, so every vortex opens and
// closes with the ship that is coming through it.
const WARP_COLS=9, WARP_CELL=100, WARP_FRAMES=75;
const HULL_IMG=document.getElementById('hull_img');
const WARP_SIZE=120; // Rendered size of the vortex in px

function rnd(arr){return arr[Math.floor(Math.random()*arr.length)];}

// ── ALPHA MASKS ─────────────────────────────────────────
// Each sprite gets one downscaled map built once,
// recording only where the ship is opaque. That lets
// us restrict hits to visible hull rather than the
// bounding rectangle. Die Abfrage danach ist ein Feldzugriff.
const MASKS = {};
const MASK_MAX = 256;    // largest edge length of a map
const MASK_MIN_A = 24;   // alpha threshold above which a point counts as hull

function buildMask(key){
  const img = IMGS[key];
  if(!img || !img.width) return null;
  try{
    const f = Math.min(1, MASK_MAX/Math.max(img.width, img.height));
    const mw = Math.max(1, Math.round(img.width*f));
    const mh = Math.max(1, Math.round(img.height*f));
    const c = document.createElement('canvas');
    c.width = mw; c.height = mh;
    const g = c.getContext('2d', {willReadFrequently:true});
    g.drawImage(img, 0, 0, mw, mh);
    const d = g.getImageData(0, 0, mw, mh).data;
    const bits = new Uint8Array(mw*mh);
    for(let i=0, p=3; i<bits.length; i++, p+=4) bits[i] = d[p] > MASK_MIN_A ? 1 : 0;
    const m = {w:mw, h:mh, bits:bits};
    MASKS[key] = m;
    return m;
  }catch(err){
    MASKS[key] = false;   // failed once, do not retry
    return null;
  }
}

function getMask(key){
  const m = MASKS[key];
  if(m === false) return null;
  if(m) return m;
  return buildMask(key);
}

// Does this world point land on visible hull?
// cx,cy = ship centre, sc = scale, flip = mirrored
function onHull(key, cx, cy, sc, flip, wx, wy, ang){
  const img = IMGS[key];
  if(!img) return true;                 // with no image, behave as before
  const m = getMask(key);
  if(!m) return true;                   // no map available, do not block
  const pw = img.width*sc, ph = img.height*sc;
  // Undo the ship rotation first, so the mask lookup happens in
  // sprite space no matter which way the hull is pointing.
  let ox = wx - cx, oy = wy - cy;
  if(ang){
    const ca = Math.cos(-ang), sa = Math.sin(-ang);
    const rx = ox*ca - oy*sa, ry = ox*sa + oy*ca;
    ox = rx; oy = ry;
  }
  let lx = ox / pw + 0.5;               // 0..1 across the sprite width
  const ly = oy / ph + 0.5;
  if(flip) lx = 1 - lx;
  if(lx < 0 || lx >= 1 || ly < 0 || ly >= 1) return false;
  const mx = (lx*m.w)|0, my = (ly*m.h)|0;
  return m.bits[my*m.w + mx] === 1;
}

// A bolt is elongated. Instead of just the centre point, nose, middle
// and tail are tested, or thin structures slip through. The probe runs
// along the round's own heading. Testing across its width instead, as
// this did before, let steeply incoming missiles miss narrow wings.
function probeAxis(b){
  const off = (b.w||8)*0.4;
  const vx = b.vx||0, vy = b.vy||0;
  const sp = Math.hypot(vx, vy);
  if(!sp) return [off, 0];
  return [vx/sp*off, vy/sp*off];
}

function bulletOnHull(e, b){
  if(e.type === 'asteroid') return true;
  const ea = e.ang || 0;
  const pr = probeAxis(b);
  return onHull(e.img, e.x, e.y, e.sc, e.flip, b.x+pr[0], b.y+pr[1], ea)
      || onHull(e.img, e.x, e.y, e.sc, e.flip, b.x,       b.y,       ea)
      || onHull(e.img, e.x, e.y, e.sc, e.flip, b.x-pr[0], b.y-pr[1], ea);
}

function bulletOnPlayer(b){
  const sc = playerSc(), fl = player.flip || false;
  const pa = player.ang || 0;
  const pr = probeAxis(b);
  return onHull(player.ship, player.x, player.y, sc, fl, b.x+pr[0], b.y+pr[1], pa)
      || onHull(player.ship, player.x, player.y, sc, fl, b.x,       b.y,       pa)
      || onHull(player.ship, player.x, player.y, sc, fl, b.x-pr[0], b.y-pr[1], pa);
}

// ── DRAW SHIP ─────────────────────────────────────────────────
// ── METALLISCHER LOOK ─────────────────────────────────────────
// Die Sprites sind vorgerendert, das Licht ist eingebacken und dreht sich
// beim Fliegen mit dem Rumpf mit. Genau das ist bei Metall falsch: der
// Glanzpunkt muss stehen bleiben, waehrend sich das Objekt dreht. Beide
// Ebenen hier arbeiten deshalb gegen die Rotation.
const GLINT={};            // je Sprite eine gebackene Glanzkarte
const GLINT_CUT = 168;     // ab dieser Helligkeit zaehlt ein Pixel als Glanz
const GLINT_BASE = 0.10;   // Grundschimmer, auch im ungünstigsten Winkel
const GLINT_SWING = 0.42;  // Zuwachs, wenn die Breitseite ins Licht kommt
const RIM_STRENGTH = 0.55; // Helligkeit der Lichtkante
const RIM_MIN_W = 90;      // erst ab dieser Darstellungsbreite lohnt sie sich

function buildGlint(key){
  const img = IMGS[key];
  if(!img || !img.width){ return null; }
  try{
    const c = document.createElement('canvas');
    c.width = img.width; c.height = img.height;
    const g = c.getContext('2d', {willReadFrequently:true});
    g.drawImage(img, 0, 0);
    const d = g.getImageData(0, 0, c.width, c.height);
    const p = d.data;
    for(let i=0; i<p.length; i+=4){
      const a = p[i+3];
      if(a < 8){ p[i+3] = 0; continue; }
      const lum = p[i]*0.299 + p[i+1]*0.587 + p[i+2]*0.114;
      let t = (lum-GLINT_CUT)/(255-GLINT_CUT);
      if(t < 0) t = 0;
      // Quadratisch, damit nur die wirklich hellen Stellen stehen bleiben
      // und nicht die halbe Lackierung mitleuchtet.
      p[i]=255; p[i+1]=250; p[i+2]=238; p[i+3] = (a*t*t)|0;
    }
    g.putImageData(d, 0, 0);
    // Weichzeichnen, sonst ist es kein Glanz sondern ein Ausschnitt.
    const c2 = document.createElement('canvas');
    c2.width = c.width; c2.height = c.height;
    const g2 = c2.getContext('2d');
    if('filter' in g2) g2.filter = 'blur(1.2px)';
    g2.drawImage(c, 0, 0);
    GLINT[key] = c2;
    return c2;
  }catch(err){
    GLINT[key] = false;   // einmal gescheitert, nicht noch einmal versuchen
    return null;
  }
}

// Ein einziger wiederverwendeter Puffer fuer alle Lichtkanten. Ein Puffer
// je Schiff und Bild waere auf einem Tablet nicht zu bezahlen.
const RIM_C = document.createElement('canvas');
RIM_C.width = 640; RIM_C.height = 640;
const RIM_G = RIM_C.getContext('2d');

// Die Lichtkante wird gegen die Rotation gerechnet: das Sprite wird ein
// zweites Mal versetzt abgezogen, und was uebrig bleibt, ist eine Sichel
// auf der Lichtseite. Nur fuer Kreuzer und groesser - an einem Jaeger von
// 58 px sind zwei Pixel Kante nicht zu sehen, kosten aber dasselbe.
function drawRimLight(key, cx, cy, scale, flipX, ang){
  const img = IMGS[key];
  if(!img || !img.width) return;
  const w = img.width*scale, h = img.height*scale;
  if(w < RIM_MIN_W) return;
  const span = Math.hypot(w, h);
  if(span > RIM_C.width) return;          // zu gross fuer den Puffer
  const la = lightAngleAt(cx, cy);
  const d = Math.max(1.5, w*0.022);
  const bx = RIM_C.width/2, by = RIM_C.height/2;

  RIM_G.setTransform(1,0,0,1,0,0);
  RIM_G.clearRect(0,0,RIM_C.width,RIM_C.height);
  RIM_G.globalCompositeOperation = 'source-over';
  RIM_G.save();
  RIM_G.translate(bx, by);
  if(ang) RIM_G.rotate(ang);
  if(flipX) RIM_G.scale(-1,1);
  RIM_G.drawImage(img, -w/2, -h/2, w, h);
  RIM_G.restore();

  // Dieselbe Silhouette, vom Licht weg versetzt, wieder abziehen.
  RIM_G.globalCompositeOperation = 'destination-out';
  RIM_G.save();
  RIM_G.translate(bx + Math.cos(la)*d, by + Math.sin(la)*d);
  if(ang) RIM_G.rotate(ang);
  if(flipX) RIM_G.scale(-1,1);
  RIM_G.drawImage(img, -w/2, -h/2, w, h);
  RIM_G.restore();

  // Die Sichel traegt noch die Rumpffarben. Einfarbig einfaerben.
  RIM_G.globalCompositeOperation = 'source-in';
  RIM_G.fillStyle = 'rgba(226,236,255,1)';
  RIM_G.fillRect(0,0,RIM_C.width,RIM_C.height);
  RIM_G.globalCompositeOperation = 'source-over';

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = RIM_STRENGTH;
  ctx.drawImage(RIM_C, bx-span/2, by-span/2, span, span,
                (cx-span/2)|0, (cy-span/2)|0, span, span);
  ctx.restore();
}

function drawShip(key,cx,cy,scale,flipX,ang){
  ctx.save();
  const img=IMGS[key];
  if(!img){ctx.restore();return;}
  const w=img.width*scale,h=img.height*scale;
  ctx.translate(cx|0,cy|0);
  // Rotation comes before the mirror, which fixes the order every other
  // helper has to invert. Sprites that face right need no mirror at all
  // once they can rotate, so for flying ships flipX stays false.
  if(ang)ctx.rotate(ang);
  if(flipX)ctx.scale(-1,1);
  ctx.drawImage(img,-w/2,-h/2,w,h);
  // Glanzlicht. Ein langer Rumpf faengt das Licht auf der Breitseite, also
  // zweimal je Umdrehung - daher der doppelte Winkel.
  // Bei abgeschaltetem Glanz wird die Karte gar nicht erst gebacken.
  // buildGlint liest das ganze Sprite per getImageData und legt zwei
  // Puffer an - genau der Ruck beim ersten Auftauchen eines neuen
  // Rumpftyps kommt von dort.
  const gl = ECO.glint ? null
           : ((GLINT[key]!==undefined) ? GLINT[key] : buildGlint(key));
  if(gl){
    const rel = (ang||0) - lightAngleAt(cx, cy);
    const inten = GLINT_BASE + GLINT_SWING*(0.5-0.5*Math.cos(rel*2));
    ctx.globalCompositeOperation='lighter';
    ctx.globalAlpha = inten;
    ctx.drawImage(gl,-w/2,-h/2,w,h);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
  if(!ECO.rim && w >= RIM_MIN_W) drawRimLight(key,cx,cy,scale,flipX,ang);
}

// ── NEBULA BACKGROUND ─────────────────────────────────────────
let nebCur=NEB_NAMES[0],nebNxt=NEB_NAMES[1],nebAlpha=1.0,nebFading=false;
// 0.004 ergab 250 Schritte, also 2.5 s Ueberblendung bei vollem Licht.
// Das dunkle Fenster ist nur 121 Schritte breit (die letzten 63 von
// TRANS_OUT plus die ersten 58 von TRANS_IN), also passt die Blende
// jetzt hinein.
const NEB_FADE_SPEED=0.0084; // ~120 Schritte = 1.2 s

function startNebFade(){
  if(nebFading)return;
  // rollBodies() stand hier. startNebFade() feuert aber bei waveCd < 63,
  // und dort ist die Blende gerade erst angesprungen: near = 0.557, k =
  // 0.016, also 1.5 % Schwaerzung. Die Ueberblendung des Hintergrunds
  // vertraegt das, weil sie sich ueber 120 Schritte zieht; der Wechsel
  // der Koerper ist ein harter Sprung in einem einzigen Bild und war
  // deshalb sichtbar. Er liegt jetzt in nextWave(), im Scheitel.
  // Pick a different random background
  let candidates=NEB_NAMES.filter(n=>n!==nebCur);
  nebNxt=candidates[Math.floor(Math.random()*candidates.length)];
  nebAlpha=1.0;nebFading=true;
}

function tickNebula(){
  tickBodies();
  if(nebFading){
    nebAlpha-=NEB_FADE_SPEED;
    if(nebAlpha<=0){nebAlpha=0;nebCur=nebNxt;nebFading=false;nebAlpha=1.0;}
  }
}

// Die Bilder liegen in 900x450, das Feld ist 800x500. Ein
// drawImage(img,0,0,W,H) hat sie deshalb seit jeher um 25 % gestaucht.
// Bei Nebelschwaden faellt das nicht auf, bei einem Planeten sofort,
// deshalb wird jetzt seitenverhaeltnistreu gefuellt und der Ueberstand
// mittig beschnitten.
function drawNebFit(img, alpha){
  const sc = Math.max(W/img.width, H/img.height);
  const dw = img.width*sc, dh = img.height*sc;
  ctx.globalAlpha = alpha;
  ctx.drawImage(img, (W-dw)/2, (H-dh)/2, dw, dh);
}

function drawNebula(){
  const imgA=NEBS[nebCur];
  if(imgA) drawNebFit(imgA, nebFading?nebAlpha:1.0);
  if(nebFading){
    const imgB=NEBS[nebNxt];
    if(imgB) drawNebFit(imgB, 1.0-nebAlpha);
  }
  ctx.globalAlpha=1.0;
}

// ── HINTERGRUNDKOERPER ────────────────────────────────────────
// Null bis zwei Planeten, dazu mit einer gewissen Wahrscheinlichkeit eine
// Sonne. Sie ziehen sehr langsam von rechts nach links und werden beim
// Wellenwechsel zusammen mit dem Hintergrund im Dunkeln getauscht, damit
// der Wechsel nicht sichtbar springt.
const BODY_PLANET_MAX = 2;
const SUN_CHANCE = 0.40;
const PLANET_W_MIN = 150, PLANET_W_MAX = 420;
const SUN_W_MIN = 90, SUN_W_MAX = 900;
// Was groesser erscheint, steht naeher und zieht schneller. Damit ergibt
// sich die Tiefenstaffelung aus der Groesse allein.
const BODY_SPD_MIN = 0.03, BODY_SPD_MAX = 0.13;
// Zwei Bremsen gegen den Kontrastverlust: eine grosse, helle Sonne wuerde
// sonst die Geschosse schlucken, die auf hellem Grund stehen statt auf
// schwarzem.
const SUN_GLOW_MAX = 0.30;
const BODY_DIM_MAX = 0.35;

let bodies = [];

// ── LICHT ─────────────────────────────────────────────────────
// Die Sonne im Hintergrund ist die Lichtquelle, und zwar als Punktlicht:
// jedes Schiff bekommt seinen eigenen Winkel. Ein Jaeger dicht an einer
// grossen Sonne wird damit sichtbar anders angeleuchtet als einer am
// gegenueberliegenden Rand, und genau das verkauft den Effekt. In den
// rund sechs von zehn Wellen ohne Sonne gilt ein fester Ersatzwinkel, der
// die ganze Welle ueber steht; gewechselt wird er unter der Blende.
let lightAng = 0;
let lightSun = null;

function rollLight(){
  lightAng = Math.random()*Math.PI*2;
  lightSun = null;
  for(const b of bodies) if(b.kind==='sun'){ lightSun = b; break; }
}

// Richtung, in die das Licht laeuft. Die beleuchtete Seite liegt also
// entgegengesetzt, bei Winkel + PI.
function lightAngleAt(x, y){
  if(lightSun) return Math.atan2(y-lightSun.y, x-lightSun.x);
  return lightAng;
}

// Gezogen wurde bisher mit Zuruecklegen, also konnte derselbe Planet
// zweimal im selben Bild stehen. Bei 48 Grafiken und zwei Planeten sind
// das rund 2 % je Welle - selten genug, dass es lange nicht auffaellt,
// haeufig genug, dass es irgendwann auffaellt. usedBodies sperrt die
// Auswahl dieser Welle, prevBodies zusaetzlich die der vorherigen, damit
// auch ueber den Wechsel hinweg nichts unmittelbar wiederkehrt.
let usedBodies = [], prevBodies = [];

function makeBody(kind){
  const all = kind==='sun' ? Object.keys(SUN_DATA) : Object.keys(PLANET_DATA);
  if(!all.length) return null;
  let pool = all.filter(function(k){
    return usedBodies.indexOf(k)<0 && prevBodies.indexOf(k)<0;
  });
  // Notausgang, falls jemand den Ordner mit zwei Bildern fuellt: lieber
  // eine Wiederholung als gar kein Planet.
  if(!pool.length) pool = all.filter(function(k){ return usedBodies.indexOf(k)<0; });
  if(!pool.length) pool = all;
  const key = pool[(Math.random()*pool.length)|0];
  usedBodies.push(key);
  const meta = (kind==='sun' ? SUN_DATA : PLANET_DATA)[key];
  const wMin = kind==='sun' ? SUN_W_MIN : PLANET_W_MIN;
  const wMax = kind==='sun' ? SUN_W_MAX : PLANET_W_MAX;
  const w = wMin + Math.random()*(wMax-wMin);
  return {
    key:key, kind:kind, meta:meta, w:w,
    // Darf ueber den Rand hinausragen. Immer vollstaendig im Bild waere
    // die langweiligste aller Anordnungen.
    x: -w*0.3 + Math.random()*(W+w*0.6),
    y: HUD_H - w*0.25 + Math.random()*(H-HUD_H+w*0.5),
    spd: BODY_SPD_MIN + (w/SUN_W_MAX)*(BODY_SPD_MAX-BODY_SPD_MIN)
  };
}

function rollBodies(){
  prevBodies = usedBodies;
  usedBodies = [];
  const out=[];
  const n=(Math.random()*(BODY_PLANET_MAX+1))|0;
  for(let i=0;i<n;i++){ const b=makeBody('planet'); if(b) out.push(b); }
  if(Math.random()<SUN_CHANCE){ const b=makeBody('sun'); if(b) out.push(b); }
  // Klein zuerst zeichnen: der naehere Koerper verdeckt dann den ferneren.
  out.sort(function(a,b){ return a.w-b.w; });
  bodies=out;
  rollLight();
}

function tickBodies(){
  for(const b of bodies){
    b.x -= b.spd;
    if(b.x + b.w < -40) b.x = W + b.w*0.5 + Math.random()*200;
  }
}

function drawBodies(){
  if(!bodies.length) return;
  // Die verbleibenden 8 %, die die Blende offen laesst, wuerden den
  // Wechsel immer noch durchblitzen lassen. Also gehen die Koerper mit
  // der Blende ganz weg und kommen dahinter neu wieder.
  const bodyA = 1-jumpDark();
  if(bodyA <= 0.01) return;
  ctx.globalAlpha = bodyA;
  let dim = 0;
  for(const b of bodies){
    const img = BODY_IMG[b.key];
    if(!img || !img.complete || !img.naturalWidth) continue;
    const h = b.w*img.height/img.width;
    const x0 = b.x - b.w/2, y0 = b.y - h/2;
    if(b.kind==='sun'){
      dim = Math.max(dim, Math.min(BODY_DIM_MAX, (b.w/SUN_W_MAX)*BODY_DIM_MAX));
      const gr = Math.min(SUN_GLOW_MAX, (b.w/SUN_W_MAX)*SUN_GLOW_MAX + 0.06);
      const g = ctx.createRadialGradient(b.x,b.y,b.w*0.42, b.x,b.y,b.w*1.25);
      g.addColorStop(0,'rgba(255,224,160,'+gr.toFixed(3)+')');
      g.addColorStop(0.55,'rgba(255,180,90,'+(gr*0.35).toFixed(3)+')');
      g.addColorStop(1,'rgba(255,150,60,0)');
      ctx.save();
      ctx.globalCompositeOperation='lighter';
      ctx.fillStyle=g;
      ctx.fillRect(b.x-b.w*1.3, b.y-b.w*1.3, b.w*2.6, b.w*2.6);
      ctx.restore();
    }
    ctx.save();
    if(b.meta.r>0){
      // JPEG ohne Alphakanal: die Scheibe wird als Kreis ausgeschnitten.
      // Radius eine Spur kleiner als gemessen, sonst steht der dunkle
      // Rand des Bildes als Saum ueber.
      const cx = x0 + b.meta.cx*b.w, cy = y0 + b.meta.cy*h;
      ctx.beginPath();
      ctx.arc(cx, cy, b.meta.r*b.w*0.995, 0, Math.PI*2);
      ctx.clip();
    }
    ctx.drawImage(img, x0, y0, b.w, h);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
  if(dim>0){
    ctx.fillStyle='rgba(4,6,12,'+(dim*bodyA).toFixed(3)+')';
    ctx.fillRect(0,0,W,H);
  }
}

// ── PALETTE ───────────────────────────────────────────────────
const P={
  pShot:'#ffffaa',eS:'#ff3300',eSB:'#ff9900',
  eA:'#ffff22',eB:'#ff8800',eC:'#ff2200',
  ui:'#00ff88',uiDk:'#004422',bHP:'#dd44ff',cr:'#ff9900',
};

// ── STARS ─────────────────────────────────────────────────────
const STARS=Array.from({length:120},()=>({
  x:Math.random()*W,y:Math.random()*H,
  spd:0.3+Math.random()*1.2,sz:Math.random()<0.06?2:1,
  clr:['#ffffff','#aaaaff','#ffcccc'][Math.floor(Math.random()*3)],
}));
function tickStars(){for(const s of STARS){s.x-=s.spd;if(s.x<0){s.x=W;s.y=Math.random()*H;}}}
function drawStars(){for(const s of STARS){ctx.fillStyle=s.clr;ctx.globalAlpha=0.7;ctx.fillRect(s.x|0,s.y|0,s.sz,s.sz);}ctx.globalAlpha=1;}

// ── PARTICLES ─────────────────────────────────────────────────
let PARTS=[];
function boom(x,y,n,big){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,spd=big?1.5+Math.random()*4:0.5+Math.random()*2.5;
    const lf=(big?45+Math.random()*55:20+Math.random()*30)|0;
    PARTS.push({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,life:lf,ml:lf,
      sz:big?(3+Math.random()*5|0):(2+Math.random()*3|0),
      clr:[P.eA,P.eB,P.eC,'#ffffff'][Math.floor(Math.random()*4)]});
  }
}
function tickParts(){
  if(PARTS.length>600)PARTS.splice(0,PARTS.length-600);
  for(var i=PARTS.length-1;i>=0;i--){
    var p=PARTS[i];
    if(p.ml===0) p.ml=p.life;
    if(p.type==='mag'){
      p.x+=(p.tx-p.x)*0.28; p.y+=(p.ty-p.y)*0.28;
    } else if(p.type==='fb'||p.type==='ring'){
      // static
    } else {
      p.x+=p.vx||0; p.y+=p.vy||0;
      if(p.vx)p.vx*=0.96; if(p.vy)p.vy*=0.96;
      if(p.type==='smoke') p.y-=0.2; // Smoke drifts upward slightly
    }
    if(--p.life<=0)PARTS.splice(i,1);
  }
}
function drawParts(){
  ctx.save();
  for(var pi=0;pi<PARTS.length;pi++){
    var p=PARTS[pi];
    if(!p.ml||p.ml===0) p.ml=p.life;
    var a=p.ml>0?Math.max(0,Math.min(1,p.life/p.ml)):1;

    if(p.type==='fb'){
      // Feuerball: Radialverlauf (eigenes save/restore)
      var prog=1-(p.life/p.ml);
      var r=Math.max(2, p.maxR*(0.4+0.6*prog));
      try {
        var gr=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,r);
        gr.addColorStop(0,'rgba(255,255,255,1)');
        gr.addColorStop(0.25,'rgba(255,240,100,'+a+')');
        gr.addColorStop(0.55,'rgba(255,100,0,'+a*0.85+')');
        gr.addColorStop(0.8,'rgba(180,30,0,'+a*0.5+')');
        gr.addColorStop(1,'rgba(60,0,0,0)');
        ctx.globalAlpha=1;
        ctx.fillStyle=gr;
        ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fill();
      } catch(ex){
        ctx.globalAlpha=a;
        ctx.fillStyle='rgba(255,150,0,0.8)';
        ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fill();
      }
      p.r=r;

    } else if(p.type==='ring'){
      var rp=Math.pow(1-(p.life/p.ml),0.5);
      var rr=p.r+(p.maxR-p.r)*rp;
      ctx.globalAlpha=Math.min(1,a*1.2);
      ctx.strokeStyle='rgba('+p.cr+','+p.cg+','+p.cb+','+Math.min(1,a*1.2)+')';
      ctx.lineWidth=Math.max(0.5,p.lw*(1.5-rp));
      ctx.beginPath();ctx.arc(p.x,p.y,rr,0,Math.PI*2);ctx.stroke();

    } else if(p.type==='mag'){
      // Magnetic particles: stacked circles for glow, no shadowBlur
      ctx.globalAlpha=a*0.35;
      ctx.fillStyle=p.clr||'#ffffff';
      ctx.beginPath();ctx.arc(p.x,p.y,(p.sz||1.5)*2.5,0,Math.PI*2);ctx.fill();
      ctx.globalAlpha=a;
      ctx.fillStyle='#ffffff';
      ctx.beginPath();ctx.arc(p.x,p.y,p.sz||1.5,0,Math.PI*2);ctx.fill();

    } else if(p.type==='deb'){
      // Debris: glow from stacked circles
      var tp=1-(p.life/p.ml);
      var dclr=lerpRGB(p.sr,p.sg,p.sb,p.er,p.eg,p.eb,tp);
      var sz=Math.max(0.8,p.sz*(1-tp*0.4));
      // Outer glow, large and transparent
      ctx.globalAlpha=a*0.25;
      ctx.fillStyle=lerpRGB(255,220,100,200,80,0,tp*0.7);
      ctx.beginPath();ctx.arc(p.x,p.y,sz*1.8,0,Math.PI*2);ctx.fill();
      // Core
      ctx.globalAlpha=a;
      ctx.fillStyle=dclr;
      ctx.beginPath();ctx.arc(p.x,p.y,sz*0.7,0,Math.PI*2);ctx.fill();

    } else if(p.type==='smoke'){
      var tp2=1-(p.life/p.ml);
      var v=p.v||50;
      ctx.globalAlpha=a*0.3;
      ctx.fillStyle='rgb('+v+','+v+','+v+')';
      var sr2=p.sz*(1+tp2*1.5);
      ctx.beginPath();ctx.arc(p.x,p.y,sr2,0,Math.PI*2);ctx.fill();

    } else {
      // Default: two stacked circles for glow, no shadowBlur
      var sz2=p.sz||2;
      var clr=p.clr||'#ffffff';
      // Outer glow
      ctx.globalAlpha=a*0.28;
      ctx.fillStyle=clr;
      ctx.beginPath();ctx.arc(p.x,p.y,sz2*1.6,0,Math.PI*2);ctx.fill();
      // Core
      ctx.globalAlpha=a;
      ctx.fillStyle=clr;
      ctx.beginPath();ctx.arc(p.x,p.y,sz2*0.6,0,Math.PI*2);ctx.fill();
      // White centre point
      ctx.globalAlpha=a*0.8;
      ctx.fillStyle='#ffffff';
      ctx.beginPath();ctx.arc(p.x,p.y,sz2*0.2,0,Math.PI*2);ctx.fill();
    }
  }
  ctx.restore(); // stellt globalAlpha, lineWidth, etc. wieder her
}


let GS='title';
let paused=false;

const K={};
const MOUSE={x:400,y:250,down:false};
// Ten, because the game asks for far more than it did when this was three
// and hull damage now carries across waves.
const LIVES_START = 10;
const LIVES_ICONS_MAX = 4;   // above this the bar shows a count, not a row
let score=0,lives=LIVES_START,wave=0,fc=0;
// Elapsed time of the current run, in logic steps. Only counts while the
// game is actually running, so a long look at the call menu is not a way
// to a better time once there is a ranking.
let runTime=0;
function fmtTime(t){
  const s=Math.floor(t/TICK_HZ);
  const h=Math.floor(s/3600), m=Math.floor(s/60)%60, sec=s%60;
  const p=function(v){ return (v<10?'0':'')+v; };
  return h ? (h+':'+p(m)+':'+p(sec)) : (p(m)+':'+p(sec));
}
let currentFaction='ntf';
let shipUnlocked=1;     // how many PLAYER_SHIPS entries this run has unlocked
let shipSwapWave=-1;    // wave in which the free switch was spent
let shipMenu=false;     // is the ship menu open?
let gameOverAt=0;       // guards against restarting with the tap that died
let player={x:80,y:250,ang:0,head:0,aimAng:0,flip:false,vx:0,vy:0,
    hp:100,maxHp:100,sh:100,maxSh:100,
    shRecharge:0.22,shDelay:0,shHit:0,fT:0,fR:28,spd:3.2,
    ship:'fiherc',secAmmo:0,secMax:0,secTimer:0,secType:'missile'};
let pBullets=[],eBullets=[],enemies=[];
let spawnQ=[],spawnT=0,waveOver=false,waveCd=0;

// Capital ship arrival offsets, in steps after the wave starts. They keep
// their own rhythm regardless of what the small craft are doing.
const CAP_FIRST = 260;
// A boss needs a run up. Arriving with the first wing would rob the
// wave of any build, and the escort would be irrelevant.
const CAP_FIRST_BOSS = 900;
const CAP_GAP = {cr:520, co:640, de:760, boss:520};
const WING_FIRST = 90;      // first wing arrives promptly, the wave has to start

// Builds the queue from a wave spec. Fighter and bomber wings alternate on
// the wave's own interval, so a swarm really is dense and a patrol really
// is sparse, instead of both inheriting a span from the capital schedule.
function buildWave(spec){
  const q=[];
  let ct=(spec.caps[0]&&spec.caps[0].indexOf('boss')===0)?CAP_FIRST_BOSS:CAP_FIRST;
  for(let i=0;i<spec.caps.length;i++){
    const type=spec.caps[i];
    const kind=type.split('_')[0];
    const entry={time:ct, type:type};
    // Only the first capital of a Runner wave carries the deadline.
    if(spec.flee && i===0){ entry.flee=spec.flee; fleeTotal++; }
    q.push(entry);
    ct += CAP_GAP[kind] || 560;
  }

  // Wings, alternating fighters and bombers so a wave with both does not
  // deliver all its fighters first and all its bombers afterwards.
  const order=[];
  let fi=spec.fi, bo=spec.bo;
  while(fi>0 || bo>0){
    if(fi>0){ order.push(spec.fiType); fi--; }
    if(bo>0){ order.push(spec.boType); bo--; }
  }
  let wt=WING_FIRST;
  for(const type of order){
    const pool=poolFor(type)||[];
    const spr=pool.length ? pool[(Math.random()*pool.length)|0] : null;
    const wid=++wingSeq;
    const size=WING_MIN+((Math.random()*(WING_MAX-WING_MIN+1))|0);
    const half=(size-1)*WING_SPACING*0.5;
    const lo=HUD_H+26+half, hi=H-26-half;
    const mid=(lo>=hi)?(HUD_H+H)/2:lo+Math.random()*(hi-lo);
    for(let k=0;k<size;k++){
      q.push({time: wt + k*WING_STAGGER, type: type, spr: spr, wing: wid,
              y: mid - half + k*WING_SPACING});
    }
    wt += spec.pause;
  }

  // Asteroids are scenery and keep arriving singly across the whole wave.
  const astSpan=Math.max(wt, ct);
  for(let i=0;i<spec.ast;i++){
    q.push({time: Math.max(30, Math.round(60 + astSpan*(i/Math.max(1,spec.ast))
                                        + (Math.random()-0.5)*120)), type:'ast'});
  }
  return q.sort(function(a,b){ return a.time-b.time; });
}

// ── ERAS ─────────────────────────────────────────────────────
// Which hulls exist, and which rules hold, depends on when the campaign is
// set. Kept out of ROLES on purpose: the packer reads that block and takes
// everything in quotes for a ship key, so it tolerates no structure of its
// own. These are plain arrays and the packer never looks at them.

    ter_bombers:    ['boathena','bomedusa','boursa'],
    ter_cruisers:   ['crfenris','crleviathan'],
    vas_fighters:   ['fianubis','fihorus','fiseth','fitoth'],
    vas_bombers:    ['boamun','boosiris'],
    vas_cruisers:   ['craten'],
    sh_fighters:    ['fibasilisk','fidragon','fimanticore','fiscorpion'],
    sh_bombers:     ['boshaitan','bonephilim'],
    sh_cruisers:    ['crcain','crlilith']
  }
};

// noBeams: FS1 has no beam weapons at all, the Lucifer excepted. That
// needs no replacement weapon - capitalFire() already fires conventional
// rounds from the gun mounts, quite separately from the beams. Skipping
// initBeams leaves the turrets doing exactly what they did.
// shieldWave: shields reach the fleet with the prototypes from The Hammer
// and the Anvil. Before that wave the player and his escorts fly without.
const ERA_RULES = {
  // shivanShieldPen: share of a primary hit that a Shivan shield actually
  // loses. At 0.25 a gun needs four times its damage to bring the shield
  // down and nothing reaches the hull until it is gone. That is the FS1
  // picture: the fleet's guns are useless against them and missiles are
  // the answer. Lifted at shieldWave, when the fleet catches up.
  // avengerWave: ab hier wirken Primaerwaffen normal gegen shivanische
  // Schilde. Eine Welle vor den Schilden, weil das Kommandobriefing von
  // The Hammer and the Anvil die Avenger-Kanone auf allen terranischen und
  // vasudanischen Schiffen meldet, ausdruecklich als wirksam dagegen.
  fs1: {noBeams:true, shieldWave:9, avengerWave:8, shivanShieldPen:0.25},
  str: {noBeams:true, shieldWave:0},
  fs2: {noBeams:false, shieldWave:0}
};

let currentEra = 'fs2';        // the endless mode is FS2 and stays so
let waveFeud = false;          // hostile factions fighting each other

function eraRule(k){
  const r = ERA_RULES[currentEra];
  return r ? r[k] : undefined;
}
function eraPool(name){
  const p = ERA_POOLS[currentEra];
  return (p && p[name]) ? p[name] : null;
}
// True while the fleet has not been given shields yet.
function eraShieldsOff(){
  const w = eraRule('shieldWave');
  return !!w && wave < w;
}
// How much of a hit a shield really loses. One everywhere except against
// Shivan hulls in the early part of FS1, where a primary bolt mostly comes
// straight back off. Missiles, bombs and beams are exempt: they were the
// answer in the original and they stay the answer here.
function shieldPen(e, kind){
  const p = eraRule('shivanShieldPen');
  if(!p) return 1;
  const aw = eraRule('avengerWave');
  if(aw && wave >= aw) return 1;          // the Avenger cannon arrives
  if(e.faction !== 'shivan') return 1;
  if(kind==='sec' || kind==='bomb' || kind==='beam') return 1;
  return p;
}

// The one place the player's shield is set. There were two, and only one
// of them knew about the era: dying in an FS1 wave handed the shield back
// at full, after which it never recharged because the recharge did know.
function resetPlayerShield(){
  player.sh = eraShieldsOff() ? 0 : player.maxSh;
}

function buildFS1Wave(n){
  const plan = FS1_PLAN[(n-1) % FS1_PLAN.length];
  currentEra = 'fs1';
  currentFaction = plan.fac==='shivan' ? 'shivan' : 'ntf';
  waveLive = 10;
  fleeTotal = 0; fleeEscaped = 0;
  guardWanted = false; guardSpawned = false; guardLost = false;
  guardClass = 'cruiser'; guardFrac = GUARD_HULL_FRAC; guardReward = 'cruiser';
  astAim = (plan.mod==='astfield'); transitSecs = 0; guardGone = false;
  astStreamCd = AST_STREAM_MEAN;
  empOut = 0; empWarn = 0; empNext = 0;
  BOMB_PORTALS = []; bombRaidLeft = 0; bombRaidCd = 99999;
  reinfAt = 0; reinfDone = true;
  gateWings = true; gateWing = 0;
  disableTarget = null;
  waveMod = plan.mod || MOD_NONE;
  waveFeud = !!plan.feud;
  // Der Titel stand bisher nur im Plan und wurde nirgends angezeigt.
  waveTitle = 'WAVE '+n+'   '+plan.name;
  titleT = TITLE_TIME;

  const q = [];
  let t = 60;

  // Everything that is simply standing there when the wave opens: cargo to
  // be protected or scanned, gun platforms guarding a depot.
  for(const [spr,cnt] of (plan.protect||[]))
    for(let k=0;k<cnt;k++)
      q.push({time:1, type:'protect', spr:spr, fac:'terran', noWarp:1,
              x:W*(0.28+0.10*k), y:H*(0.34+0.16*k)});
  for(const [spr,cnt] of (plan.scans||[]))
    for(let k=0;k<cnt;k++)
      q.push({time:1, type:'container', spr:spr, fac:plan.fac, scan:1,
              noWarp:1, x:W*(0.58+0.09*k), y:H*(0.40+0.16*k)});
  for(const [spr,cnt] of (plan.sentries||[]))
    for(let k=0;k<cnt;k++)
      q.push({time:1, type:'sentry', spr:spr, fac:plan.fac, noWarp:1,
              x:W*(0.80+0.06*(k%2)), y:H*(0.18+0.13*k)});

  // Freighters and transports crossing the field. Catching them before the
  // edge is the job; the ones that get through cost points.
  for(const [spr,cnt] of (plan.runners||[]))
    for(let k=0;k<cnt;k++){
      q.push({time:t, type:'freighter', spr:spr, fac:plan.fac, runner:1,
              hpMul:RUNNER_HP_MUL, y:H*(0.30+0.22*k)});
      fleeTotal++;
    }

  if(plan.guard)
    q.push({time:20, type:plan.guard.type, spr:plan.guard.spr,
            fac:plan.guard.fac, guard:1, still:plan.guard.still?1:0,
            noWarp:1, x:W*0.30, y:H*0.5});

  if(plan.cap)
    q.push({time:260, type:plan.cap.type, spr:plan.cap.spr, fac:plan.cap.fac,
            disable:plan.cap.disable?1:0, hpMul:plan.cap.hp||0,
            y:H*0.5});

  for(const w of (plan.wings||[])){
    const [spr,cnt,hp,fac] = w;
    const wid = ++wingSeq;
    const mid = HUD_H+80+Math.random()*(H-HUD_H-160);
    const half = (cnt-1)*WING_SPACING*0.5;
    for(let k=0;k<cnt;k++)
      q.push({time:t+k*WING_STAGGER, type:'fi_ntf', spr:spr, wing:wid,
              fac:fac||plan.fac, hpMul:hp||0,
              noShield:(plan.noShield && (fac||plan.fac)!=='shivan')?1:0,
              y:mid-half+k*WING_SPACING});
    t += 140;
  }

  // The ace only appears if the Orff came through the wave before. That
  // condition is in the original and it is the reason the campaign needs a
  // memory at all.
  if(plan.ace && CAMP.orffOk)
    q.push({time:t+120, type:'fi_ntf', spr:plan.ace, wing:++wingSeq,
            fac:plan.fac, noShield:1, y:H*0.5});

  // Ships that arrive as an escort and turn. The Hammer of Light joining
  // the convoy and then opening fire is the first of them.
  for(const [spr,cnt] of (plan.turncoats||[]))
    for(let k=0;k<cnt;k++)
      q.push({time:t+200+k*WING_STAGGER, type:'defector', spr:spr,
              y:H*(0.35+0.12*k)});

  return q.sort(function(a,b){ return a.time-b.time; });
}

// ── DEATH ────────────────────────────────────────────────────
// One place where an enemy dies. There were two, and they had already
// drifted apart: the primary bolt path dropped pickups, the secondary path
// did not. Adding the crossfire between hostile factions would have made a
// third copy, so they are folded together here first.
//   award  the player gets the points. False when one enemy kills another.
//   drop   pickups fall. Only from a kill the player earned.
function killEnemy(e, idx, award, drop){
  if(!e || e.dead) return;
  e.dead = true;
  if(e.pickup) cargoLost(e);
  if(award) score += e.pts;
  statKill(e.type);
  if(drop) maybeDropTicket(e);
  triggerExpl(e.x, e.y, e.type, e.faction||'ntf', e);
  if(e.type==='boss'){ bossAlive=false; bossSlain=true; }
  const k = (idx!=null && enemies[idx]===e) ? idx : enemies.indexOf(e);
  if(k>=0) enemies.splice(k,1);
}

// ── WING GATING ──────────────────────────────────────────────
// FreeSpace sends the next wing once the previous one is gone. Everything
// here is the bookkeeping for that; the decision itself sits in the queue
// loop in update().
let gateWings = true;      // false on a crossing, there is no clear field
let gateWing  = 0;         // id of the wing currently allowed out
const GATE_RETRY = 30;     // steps before asking again, a third of a second

// Scenery does not count as work. Without this a standing asteroid field
// would hold the wave open forever, because the end condition asks for an
// empty enemies[] and rocks that do not drift never leave it.
function liveThreatCount(){
  let n=0;
  for(const e of enemies) if(!e.scenery && !e.dead && e.rollT==null) n++;
  return n;
}

// ── DISABLE INSTEAD OF DESTROY ───────────────────────────────
// First Strike asks for a cruiser to be left alive and useless rather than
// destroyed. That needs no new mechanic, only a different question at the
// end of the wave. Subsystems have been in since v40.
let disableTarget = null;
function disableDone(){
  const t = disableTarget;
  if(!t || t.dead) return true;              // destroyed also ends it
  return !subOK(t,'weapons') && !subOK(t,'engines');
}

// ── SCANNING ─────────────────────────────────────────────────
// Proximity plus dwell. No new control: fly close, stay there, a ring
// fills. Taking a hit stops the fill, which is what makes a quiet wave
// tense instead of slow. player.shDelay is set to 90 on any hit and is
// therefore the signal that already exists for "under fire right now".
const SCAN_R    = 110;     // px, a little over two ship lengths
const SCAN_TIME = 210;     // steps at 100 Hz, so 2.1 s of undisturbed dwell
const SCAN_DECAY = 2;      // lost per step when out of range or under fire
function tickScan(){
  if(GS!=='playing') return;
  for(const e of enemies){
    if(!e.scan || e.scanned || e.dead) continue;
    const d = Math.hypot(player.x-e.x, player.y-e.y);
    if(d<=SCAN_R && player.shDelay<=0){
      e.scanT = (e.scanT||0)+1;
      if(e.scanT>=SCAN_TIME){
        e.scanned = true;
        score += 200;
        if(STATS.scans==null) STATS.scans=0;
        STATS.scans++;
        SUB_MSGS.push({x:e.x, y:e.y, txt:'SCAN COMPLETE',
                       life:200, ml:200, ally:true});
      }
    } else if(e.scanT>0){
      e.scanT = Math.max(0, e.scanT-SCAN_DECAY);
    }
  }
}
// The ring sits at the object, not at the player, so it reads as a
// property of the thing being scanned. Same visual language as the hold
// ring around the player: a soft arc that fills clockwise from the top.
function drawScanRing(e){
  if(!e.scan) return;
  const img = IMGS[e.img];
  const r = (img ? Math.max(img.width,img.height)*e.sc*0.62 : 24) + 8;
  ctx.save();
  ctx.translate(e.x|0, e.y|0);
  if(e.scanned){
    ctx.strokeStyle='rgba(90,255,170,0.55)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.stroke();
  } else {
    const t = Math.min(1, (e.scanT||0)/SCAN_TIME);
    ctx.strokeStyle='rgba(110,216,255,0.20)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.stroke();
    if(t>0){
      ctx.strokeStyle='rgba(110,216,255,0.95)'; ctx.lineWidth=3;
      ctx.beginPath();
      ctx.arc(0,0,r,-Math.PI/2,-Math.PI/2+Math.PI*2*t);
      ctx.stroke();
    }
  }
  ctx.restore();
}

// ── DEFECTORS ────────────────────────────────────────────────
// Allies are not protected by a side test. They are protected by living in
// allies[], and the player's bullet loop only ever looks at enemies[]. A
// ship that changes sides therefore has to be handed from one array to the
// other; a flag would change nothing, because nobody would look.
//
// What has to travel with it:
//   pts      mkAllySmall() does not set it. Without it score += e.pts on
//            the kill makes the score NaN for the rest of the run.
//   side     smallFire() reads it every shot, so the bullets swap to the
//            enemy list on their own once it is gone.
//   faction  triggerExpl() takes e.faction||'ntf' for the debris colour,
//            and 'terran' is not one it knows.
// The hand over runs backwards through the array, so the splice cannot
// skip an entry.
// A non-combatant on the friendly side. It sits where it is put and does
// nothing; the point is that it has to survive. guard:true hands it to the
// existing bookkeeping, which already fires GUARD_PENALTY on its death.
// Welcher Typzweig einen Schuetzling traegt. Frachtcontainer bleiben
// Container, alles andere laeuft ueber den Frachterzweig - der Rumpf kommt
// ohnehin aus der Laenge, es geht hier nur um das Verhalten.
function protectType(spr){
  const c = hullClass(spr);
  // Container und Rettungskapseln sind wehrlos und duenn. Ein Frachter
  // haelt etwas aus, eine Kapsel nicht - das ist der Punkt.
  return (c==='fc' || c==='ep') ? 'container' : 'freighter';
}
function spawnProtected(sp){
  const a = mkEnemy(sp.type==='protect' ? protectType(sp.spr) : sp.type, sp.spr, sp.y);
  if(!a) return;
  a.side = 'ally';
  a.uid = sp.uid;
  if(sp.uid) EV_SEEN[sp.uid] = true;
  a.faction = sp.fac || 'terran';
  if(sp.pickup) a.pickup = true;
  a.guard = true;
  a.small = false;
  a.vx = 0; a.vy = 0;
  a.minY = a.y; a.maxY = a.y;      // updateAllies() nudges vy, so pin it
  // Ein Andockauftrag wird hier gesetzt: applySpawnOpts laeuft fuer
  // Schuetzlinge nicht, weil sie ueber diesen Weg entstehen.
  if(sp.dockTo){
    a.dockTo = sp.dockTo;
    a.crossAfter = sp.cross || 0.38;
    // Die Hoehe darf nicht gepinnt sein, sonst kommt er nie zum
    // Andockpunkt hoch.
    a.minY = HUD_H+20; a.maxY = H-20;
  }
  if(sp.still){ a.vy = 0; a.minY = a.y; a.maxY = a.y; }
  a.warp = 0; a.warpMax = 1;
  a.flip = needsFlip(a.img, false);
  if(sp.x != null) a.x = sp.x;
  if(sp.cross && !sp.dockTo){
    a.crossing = sp.cross;         // Bildpunkte je Schritt
    a.flip = needsFlip(a.img, false);   // faehrt nach rechts, schaut nach rechts
    if(sp.x == null) a.x = -40;    // von links herein
  }
  allies.push(a);
}

function spawnDefector(y, spr){
  const a = mkAllySmall('fighter', 'terran', spr || 'fiapollo', y);
  a.warp = 60; a.warpMax = 60;
  a.defectAt = 420;          // 4.2 s flying as an escort before it turns
  allies.push(a);
}
function defect(a){
  const _i = allies.indexOf(a);
  if(_i >= 0) allies.splice(_i, 1);    // sonst steht es in beiden Listen
  a.side = 'enemy';
  a.defectLock = false;      // gewechselt, ab jetzt normal zu toeten
  a.faction = (currentFaction==='hol') ? 'hol' : 'renegade';
  a.pts = (a.type==='bomber') ? 150 : 100;
  a.defectAt = 0;
  a.small = true;
  enemies.push(a);
  SUB_MSGS.push({x:a.x, y:a.y, txt:'TURNING HOSTILE',
                 life:200, ml:200, ally:false});
}
// Waagerechte Fahrt eines Schuetzlings. Verlaesst er rechts das Feld, ist
// er durchgebracht: er wird still entfernt, ohne guardLost zu setzen -
// sonst zaehlte der Erfolg als Verlust.
let crossDone = 0, crossTotal = 0;
// Ist noch ein Schuetzling unterwegs? Abgeschossene stehen nicht mehr in
// allies, die Welle haengt also nicht, wenn einer verloren geht.
// Steht noch ein Ereignis aus, das Schiffe ins Feld bringt oder die Seite
// wechselt? Dann ist die Welle nicht vorbei, auch wenn gerade nichts lebt.
function evPending(){
  for(const e of EV){
    if(e.done) continue;
    // Nachschub abzuschalten haelt keine Welle offen.
    if(e.w!=='einwarpen' && e.w!=='seite') continue;
    // Ein Ausloeser, dessen Ziel nie im Feld war oder schon weg ist, kann
    // nicht mehr feuern. Sonst haengt die Welle fuer immer.
    if(['zerstoert','alleZerstoert','verlaesst','anzahlUnter','rumpfUnter','subsystem'].indexOf(e.t)>=0){
      if(evSeen(e.a) && byId(e.a).length===0) continue;
    }
    // Ein Andockauftrag, dessen Ziel nicht mehr existiert, kann nicht
    // mehr feuern. Sonst laeuft die Welle endlos weiter.
    if(e.t==='angedockt'){
      const dk = byId(e.a)[0];
      if(!dk) { if(evSeen(e.a)) continue; }
      else if(dk.dockTo && byId(dk.dockTo).length===0 && evSeen(dk.dockTo)) continue;
    }
    return true;
  }
  return false;
}
// Ist noch ein Fluechtling unterwegs? Dann laeuft die Welle, auch wenn
// sonst nichts mehr im Feld steht.
function escPending(){
  for(const e of enemies) if(e.escaping && !e.dead) return true;
  return false;
}
function crossPending(){
  for(const a of allies) if(a.crossing && !a.dead) return true;
  return false;
}
// Gegner mit Fluchtkurs nach rechts. Erreichen sie den Rand, sind sie weg.
let escTotal = 0, escGone = 0;
// Sekundaerexplosionen auf einem sterbenden Grosskampfschiff. Es steht
// noch, es schiesst nicht mehr, und es reisst Stueck fuer Stueck auf.
// Grosskampfschiff auf Rammkurs. Es sucht sich das naechste verbuendete
// Grosskampfschiff, faehrt darauf zu und schlaegt ein.
// Weltkoordinaten des ersten Andockpunkts eines Schiffs.
function dockPoint(o){
  const m = mountsFor(o.img), img = IMGS[o.img];
  if(!m || !m.docks || !m.docks.length || !img) return {x:o.x, y:o.y};
  const d = m.docks[0];
  const s = o.flip ? -1 : 1;
  return {x:o.x + (img.width*o.sc*0.5)*d.dx*s,
          y:o.y + (img.height*o.sc*0.5)*d.dy};
}
// Offset of a ship's first dock point from its centre.
function dockOffset(o){
  const p = dockPoint(o);
  return {x:p.x-o.x, y:p.y-o.y};
}
// Still in one of the two lists and not dead.
function unitAlive(o){
  return !!o && !o.dead && (allies.indexOf(o)>=0 || enemies.indexOf(o)>=0);
}
// Are ships of this id still on their way into the field?
function idPending(id){
  for(const q of spawnQ) if(q.uid===id) return true;
  return !!(EV_HELD[id] && EV_HELD[id].length);
}
// Counts one cargo run as lost, once. Every path that loses cargo goes
// through here, so a container can never be counted twice.
function cargoLost(c){
  if(!c || c.lostCounted) return;
  c.lostCounted = true;
  protLost++; guardLost = true;
}
// One container per freighter. Nearest free one of the id, where free means
// alive, not carried, not left behind and not promised to a living freighter.
// byId() alone always answered with the first ship, which is how two
// freighters ended up fighting over one container.
function claimCargo(e){
  let best = null, bd = 1e18;
  for(const c of byId(e.dockTo)){
    if(c.type!=='container' || c.carried || c.stranded) continue;
    if(c.resBy && c.resBy!==e && unitAlive(c.resBy)) continue;
    const d = (c.x-e.x)*(c.x-e.x) + (c.y-e.y)*(c.y-e.y);
    if(d < bd){ bd = d; best = c; }
  }
  if(best){ best.resBy = e; e.dockRes = best; }
  return best;
}
// Decided: a freighter whose container is gone leaves empty. It does not
// look for another one, and it does not count as a delivery.
function leaveEmpty(e, wasCargo){
  if(e.dockRes && e.dockRes.resBy===e) e.dockRes.resBy = null;
  e.dockRes = null; e.dockTo = null;
  if(wasCargo){
    e.emptyRun = true;
    SUB_MSGS.push({x:e.x, y:e.y-28, txt:'NO CARGO', life:150, ml:150,
                   ally:false, tone:'bad'});
  }
  if(e.crossAfter) e.crossing = e.crossAfter;
}
// Is anybody still able to come for this container? A living freighter
// heading for its id without a claim on another one, or one still queued
// or held back for an event.
function cargoStillWanted(c){
  for(const o of enemies.concat(allies))
    if(!o.dead && o.dockTo===c.uid && (!o.dockRes || o.dockRes===c)) return true;
  for(const q of spawnQ) if(q.dockTo===c.uid) return true;
  for(const k in EV_HELD) for(const q of EV_HELD[k]) if(q.dockTo===c.uid) return true;
  return false;
}
// Moves carried cargo so that both dock points meet. Runs after all
// movement in the step, otherwise the cargo trails one step behind.
function carryCargo(e){
  const c = e.dockedTo;
  if(!c) return;
  if(!unitAlive(c)){
    // Shot off the carrier on the way: he arrives with nothing.
    e.dockedTo = null; e.hasCargo = false; e.emptyRun = true;
    cargoLost(c);
    return;
  }
  const p = dockPoint(e), o = dockOffset(c);
  c.x = p.x - o.x; c.y = p.y - o.y;
  c.vx = 0; c.vy = 0; c.warpX = c.x; c.warpY = c.y;
}
// Decided: cargo dies with its carrier. The carrier was already counted
// as lost, the cargo is not counted a second time.
function dropCargo(c){
  if(!c || c.dead) return;
  c.lostCounted = true;
  c.dead = true; c.hp = 0;
  triggerExpl(c.x, c.y, 'container', c.faction || 'vasudan', c);
  let k = allies.indexOf(c);  if(k>=0) allies.splice(k,1);
  k = enemies.indexOf(c);     if(k>=0) enemies.splice(k,1);
}
function tickCarry(){
  for(const e of enemies.concat(allies)) if(e.dockedTo) carryCargo(e);
  for(const c of enemies.concat(allies))
    if(c.carrier && !c.dead && !unitAlive(c.carrier)) dropCargo(c);
}
function tickDocking(){
  const all = enemies.concat(allies);
  // Containers nobody can come for any more. This runs before the wave end
  // test, so an abandoned container never holds the wave open.
  for(const c of all){
    if(!c.pickup || c.carried || c.stranded || c.dead || c.warp>0) continue;
    if(cargoStillWanted(c)) continue;
    c.stranded = true; c.scenery = true; c.guard = false;
    // A freighter that died on its way here was already counted as lost.
    if(c.resBy && c.resBy.dead) c.lostCounted = true;
    else cargoLost(c);
    c.resBy = null;
    SUB_MSGS.push({x:c.x, y:c.y-24, txt:'CARGO LEFT BEHIND', life:170, ml:170,
                   ally:false, tone:'bad'});
  }
  for(const e of all){
    if(!e.dockTo || e.dead || e.warp>0) continue;
    const group = byId(e.dockTo);
    let t = group[0];
    if(t && t.type==='container') e.wantsCargo = true;
    if(!t || t.type==='container'){
      if(e.dockRes){
        // Decided: his container is gone, he does not look for another.
        if(!unitAlive(e.dockRes) || e.dockRes.carried || e.dockRes.stranded){
          leaveEmpty(e, true); continue; }
        t = e.dockRes;
      } else if(t){
        t = claimCargo(e);
      }
      if(!t){
        // Containers of this id may still be arriving - then wait.
        if(idPending(e.dockTo) || !evSeen(e.dockTo)) continue;
        leaveEmpty(e, !!e.wantsCargo);
        continue;
      }
    }
    // Head for the spot where his dock point meets the target's.
    const p = dockPoint(t), o = dockOffset(e);
    const dx = (p.x-o.x) - e.x, dy = (p.y-o.y) - e.y;
    const L = Math.hypot(dx, dy);
    e.vx = 0; e.vy = 0;
    // The field clamp can keep him off the exact spot. If he stops getting
    // closer while near enough, he docks where he is.
    if(e.dockBest==null || L < e.dockBest-0.05){ e.dockBest = L; e.dockStall = 0; }
    else e.dockStall = (e.dockStall||0) + 1;
    if(!(L <= 1 || (L <= DOCK_NEAR && e.dockStall > 60))){
      const sx = DOCK_SPD*1.6, sy = DOCK_SPD;
      e.x += Math.max(-sx, Math.min(sx, dx));
      e.y += Math.max(-sy, Math.min(sy, dy));
      continue;
    }
    // Docked.
    EV_DOCK[e.uid] = true;
    SUB_MSGS.push({x:e.x, y:e.y-28, txt:'DOCKED', life:150, ml:150,
                   ally:true, tone:'good'});
    if(t.type==='container'){
      e.dockedTo = t; t.carrier = e; t.resBy = e;
      t.carried = true; t.guard = false; t.scenery = true;
      e.hasCargo = true;
      carryCargo(e);
    }
    e.dockTo = null; e.dockRes = null;
    // Load first, then leave.
    if(e.crossAfter) e.crossing = e.crossAfter;
  }
}
function tickCapRam(){
  for(let i=enemies.length-1;i>=0;i--){
    const e = enemies[i];
    if(!e.capRam || e.dead || e.warp>0 || e.rollT!=null) continue;
    let t=null, bd=1e9;
    for(const a of allies){
      if(a.dead || a.small) continue;
      const d=(a.x-e.x)*(a.x-e.x)+(a.y-e.y)*(a.y-e.y);
      if(d<bd){ bd=d; t=a; }
    }
    if(!t) continue;
    // Direkter Kurs, ohne Halteposition - er will nicht schiessen.
    e.targetX = null;
    const dx=t.x-e.x, dy=t.y-e.y, L=Math.hypot(dx,dy)||1;
    // Senkrecht zuegiger als waagerecht: sonst kriecht er die Hoehe hoch
    // und ist laengst da, bevor er auf Hoehe ist.
    e.x += dx/L*e.capRam;
    e.y += dy/L*e.capRam*3.4;
    const ei=IMGS[e.img], ti=IMGS[t.img];
    const hwA=(ei?ei.width*e.sc:100)*0.5,  hwB=(ti?ti.width*t.sc:100)*0.5;
    const hhA=(ei?ei.height*e.sc:40)*0.5,  hhB=(ti?ti.height*t.sc:40)*0.5;
    // Waagerecht und senkrecht getrennt pruefen: ein Kreis laesst ihn
    // hoch ueber dem Ziel explodieren, weil der Abstand dort auch klein ist.
    if(Math.abs(dx) < (hwA+hwB)*0.62 && Math.abs(dy) < (hhA+hhB)*0.62){
      t.hp -= Math.max(1, Math.round((t.maxHp||100)*RAM_PCT_CAPITAL));
      hullHit(e.x, e.y);
      triggerExpl(e.x, e.y, 'destroyer', e.faction, e);
      spawnShock(e.x, e.y, 170, 3.0, 0.024);
      SUB_MSGS.push({x:e.x, y:e.y-40, txt:'IMPACT', life:150, ml:150, ally:false});
      e.dead = true; e.hp = 0;
      enemies.splice(i,1);
    }
  }
}
function tickDeathRoll(){
  for(let i=enemies.length-1;i>=0;i--){
    const e = enemies[i];
    if(e.rollT==null) continue;
    e.rollT--;
    if(e.rollT % DEATH_ROLL_GAP === 0){
      const img = IMGS[e.img];
      const hw = img ? img.width*e.sc*0.42 : 40;
      const hh = img ? img.height*e.sc*0.34 : 16;
      const px = e.x + (Math.random()*2-1)*hw;
      const py = e.y + (Math.random()*2-1)*hh;
      triggerExpl(px, py, 'cruiser', e.faction, null);
      addShake(2, 8);
    }
    if(e.rollT <= 0){
      e.rollT = null;
      e.hp = 0;
      spawnShock(e.x, e.y, 150, 2.6, 0.020);
      // Ueber killEnemy, nicht daneben: dort haengen Punkte, Statistik,
      // Ticketwurf und die Bossmarkierung.
      killEnemy(e, i, true, true);
    }
  }
}
function tickEscapers(){
  for(let i=enemies.length-1;i>=0;i--){
    const e = enemies[i];
    if(!e.escaping || e.dead || e.warp>0) continue;
    // Kein Antrieb, keine Fahrt. Das war der Sinn des Subsystems.
    if(hasSubsystems(e) && !subOK(e,'engines')) continue;
    e.x += e.escaping;
    // Erst weg, wenn der Rumpf ganz draussen ist - nicht wenn die Mitte
    // den Rand erreicht und das Heck noch im Bild steht.
    const _ei = IMGS[e.img];
    const _ew = _ei ? _ei.width*e.sc : 120;
    // Ganz draussen heisst: die linke Kante hat den rechten Rand passiert.
    if(e.x - _ew*0.5 > W + 8){
      escGone++;
      EV_LEFT[e.uid] = true;
      score = Math.max(0, score - Math.round((e.pts||200)*ESCAPE_PENALTY));
      SUB_MSGS.push({x:W-110, y:e.y, txt:'TARGET ESCAPED', life:170, ml:170,
                     ally:false, tone:'bad'});
      enemies.splice(i,1);
    }
  }
}
function tickCrossGuards(){
  for(const a of allies.slice()){
    if(!a.crossing || a.dead || allies.indexOf(a)<0) continue;
    a.x += a.crossing;
    if(a.x > W+60){
      if(a.dockedTo){ a.dockedTo.dead = true;
        const _ci = allies.indexOf(a.dockedTo);
        if(_ci>=0) allies.splice(_ci,1);
        const _ce = enemies.indexOf(a.dockedTo);
        if(_ce>=0) enemies.splice(_ce,1); }
      crossDone++; if(!a.emptyRun) protSaved++;
      { const _fi = allies.indexOf(a); if(_fi>=0) allies.splice(_fi,1); }
      SUB_MSGS.push({x:W-90, y:a.y,
                     txt: (hullClass(a.img)==='ep') ? 'RESCUED'
                          : (a.emptyRun ? 'LEFT EMPTY' : 'DELIVERED'),
                     life:150, ml:150, ally:true, tone:'good'});
    }
  }
  // Sind alle durch, ist der Auftrag erfuellt und die Welle raeumt nur noch auf.
  if(crossTotal && crossDone >= crossTotal) guardGone = true;
}

// Ein lebendes Fuehrungsschiff mit heilem Funkraum genuegt. Zerstoerte
// zaehlen nicht mehr mit - wer die Typhon mit heilem Funkraum abschiesst,
// waehrend der der Hatshepsut schon hin ist, bekommt trotzdem keinen
// Nachschub mehr.
let commsCut = false;
function enemyRadioAlive(){
  for(const e of enemies){
    if(e.dead || e.warp>0) continue;
    if(!hasSubsystems(e)) continue;
    if(subOK(e,'communication')) return true;
  }
  return false;
}
let commsSeen = false;
// Lebt noch ein Grosskampfschiff? Ohne eines gibt es keinen Funkraum, der
// zerstoert sein koennte - dann ist die Welle vorbei und nicht der Funk.
function enemyCapAlive(){
  for(const e of enemies)
    if(!e.dead && e.warp<=0 && hasSubsystems(e)) return true;
  return false;
}
function tickComms(){
  if(commsCut) return;
  if(enemyRadioAlive()){ commsSeen = true; return; }
  if(!enemyCapAlive()) return;
  // Ohne vorher gesehenen heilen Funkraum gibt es nichts abzuschalten.
  // Einwarpende Schiffe zaehlen dabei nicht, sonst feuert die Meldung in
  // der Luecke zwischen Ankunft und fertigem Warp.
  if(!commsSeen) return;
  commsCut = true;
  // Staffeln, die noch nicht da sind, kommen nicht mehr.
  let weg = 0;
  for(let i=spawnQ.length-1;i>=0;i--){
    const t = spawnQ[i].type;
    if(t && WING_TYPES[t]){ spawnQ.splice(i,1); weg++; }
  }
  SUB_MSGS.push({x:W/2, y:H*0.42, txt:'ENEMY COMMS DOWN', life:200, ml:200, ally:true});
}

function tickDefectors(){
  if(GS!=='playing') return;
  for(let i=allies.length-1;i>=0;i--){
    const a = allies[i];
    if(!a.defectAt || a.dead) continue;
    if(--a.defectAt>0) continue;
    allies.splice(i,1);
    defect(a);
  }
}

// ── STANDING ASTEROID FIELD ──────────────────────────────────
// Rocks that turn but do not travel. Everything mkEnemy('ast') builds
// drifts left and is cleaned up at the edge; these are marked scenery so
// the wave end ignores them, and the clearing beat pushes them off at the
// end like any other loose object.
function seedStaticField(n){
  for(let i=0;i<n;i++){
    const y = HUD_H+40+Math.random()*(H-HUD_H-80);
    const a = mkEnemy('ast', null, y);
    if(!a) continue;
    a.x = 90+Math.random()*(W-180);
    a.vx = 0; a.vy = 0;
    a.rotS = (Math.random()-0.5)*0.02;
    a.scenery = true; a.side='enemy'; a.warpMax = 1;
    enemies.push(a);
  }
}

// ── SPAWN OPTIONS ────────────────────────────────────────────
// Anything a queue entry wants to say about the ship it produces, applied
// in one place after the ship exists. Keeping it here means mkEnemy keeps
// its eleven branches and none of them grow a parameter list.
function applySpawnOpts(e, sp){
  if(!e || !sp) return;
  // Anything already in place when the wave opens: cargo sitting at a
  // depot, a gun platform guarding it. In the test both warped in, which
  // reads as reinforcements arriving rather than as scenery that was
  // always there.
  if(sp.noWarp){ e.warp=0; e.warpMax=1; }
  // A fixed position on the field. Without it the non-combatants keep the
  // spawn x of a ship that is expected to fly in from the right, and a
  // container that never moves simply stays off screen.
  if(sp.x!=null){ e.x=sp.x; e.warpX=sp.x; }
  // A disable job wants the ship to stay put. checkDisarmFlee() starts a
  // twelve second clock the moment the weapons are gone, so in the test
  // the cruiser began its jump out halfway through the task.
  if(sp.scenery) e.scenery = true;
  if(sp.capRam){
    e.capRam = sp.capRam; e.noFlee = true;
    // Volle Hoehe: ein Rammkurs muss steigen und sinken koennen. still
    // gilt nur fuer das Ziel, nicht fuer den Angreifer.
    e.minY = HUD_H+10; e.maxY = H-10;
  }
  if(sp.dockTo) e.dockTo = sp.dockTo;
  if(sp.pickup) e.pickup = true;
  // Kein Auf und Ab: ein Rammstoss auf ein schwebendes Ziel ist Zufall.
  if(sp.still){ e.vy = 0; e.minY = e.y; e.maxY = e.y; }
  // Eine Station, die der Spieler halten soll, ist ein Ort und kein Ziel.
  // Unverwundbar heisst hier: sie nimmt keinen Schaden und zaehlt nicht
  // fuer das Wellenende - sonst waere jede Welle mit ihr unbeendbar.
  if(sp.invuln){ e.invuln = true; e.scenery = true; }
  // Halb ausserhalb des Feldes: eine Arcadia ist groesser als der Schirm,
  // und das soll man sehen.
  if(sp.edge){
    const _ii = IMGS[e.img];
    const _iw = _ii ? _ii.width*e.sc : 400;
    e.x = W + _iw*(sp.edge-0.5); e.warpX = e.x;
  }
  if(sp.escape){
    e.escaping = sp.escape;          // Bildpunkte je Schritt nach rechts
    e.noFlee = true;                 // sie springt nicht, sie faehrt
    // Weit hinter der Wegschwelle: die Fahrt stoppt bei targetX, und wenn
    // targetX davor liegt, parkt das Schiff ausserhalb des Bildes.
    const _si = IMGS[e.img];
    const _sw = _si ? _si.width*e.sc : 120;
    e.targetX = W + _sw*2;
    e.vx = 0; e.vy = 0;    // gefahren wird ueber tickEscapers, nicht ueber vx
    e.flip = needsFlip(e.img, false);
  }
  if(sp.disable) e.noFlee = true;
  // Unshielded on purpose. Vasudan fighters carry none in the early part
  // of FS1, and the wave says so rather than the ship class deciding.
  if(sp.noShield){ e.maxSh = 0; e.sh = 0; }
  // A runner is counted, so the wave can tell how many got away.
  if(sp.runner) e.runner = true;
  // A ship that has lost its drive and is only there to be defended.
  if(sp.still){ e.vx = 0; e.vy = 0; e.still = true; }
  // Damaged on arrival. maxHp is deliberately left alone so the hull bar
  // shows the ship as hurt rather than as small.
  if(sp.hpMul){
    e.hp = Math.max(1, Math.round(e.hp*sp.hpMul));
    // Above one the bar has to grow with the hull, or the ship arrives
    // reading as over full. Below one maxHp stays where it is on purpose,
    // so a damaged ship looks damaged rather than small. Subsystems are
    // laid out before this runs and keep their original size either way,
    // which is the point for a disable job: the same 492 points of system
    // work, but more hull to absorb what misses.
    if(sp.hpMul>1) e.maxHp = Math.max(e.maxHp, e.hp);
    // The shield has to come down with it. A fighter carries 48 hull and
    // 30 shield, so leaving the shield at full would make an hpMul of
    // 0.40 mean 63 % of the real toughness rather than 40 %. maxSh is
    // lowered as well, otherwise it simply recharges back to full within
    // three seconds and the whole thing is undone.
    if(e.maxSh){
      e.maxSh = Math.max(1, Math.round(e.maxSh*sp.hpMul));
      e.sh = e.maxSh;
    }
  }
  if(sp.fac) e.faction = sp.fac;
  if(sp.scan){ e.scan = true; e.noTarget = true; }
  // Tiefenversatz fuer mehrere Grosskampfschiffe derselben Kennung.

  // Eigenes Hoehenband, damit mehrere Schiffe derselben Kennung nicht
  // durch dasselbe Feld wandern und aneinander abprallen.
  // Volle Hoehe fuer alle, aber versetzt gestartet und in wechselnder
  // Richtung: sie schweben aneinander vorbei statt uebereinander.
  // Tiefenversatz aus der eigenen Breite: er muss die Summe der halben
  // Breiten uebersteigen, sonst greift separateCapitals() dauernd ein und
  // die Schiffe schubsen sich gegenseitig aus ihrer Bahn. Teilen sie sich
  // keinen Bildraum, waehlt assignStation() die Hoehe frei - und alle
  // nutzen das ganze Feld.
  if(sp.capIndex){
    const _ci = IMGS[e.img];
    const _cw = _ci ? _ci.width*e.sc : 120;
    e.targetX = (e.targetX!=null ? e.targetX : e.x) - sp.capIndex*(_cw + 16);
  }
  if(sp.disable){
    disableTarget = e;
    e.disableTgt = true; e.disableMet = false;
    // Die Subsysteme stehen zu diesem Zeitpunkt schon, also werden sie
    // nachtraeglich umgesetzt statt initSubsystems zu verzweigen.
    if(e.subs){
      const dh = Math.max(30, Math.round(e.maxHp*DISABLE_SUB_FRAC));
      for(const s of e.subs){ s.hp = dh; s.maxHp = dh; }
    }
  }
}

// ── TEST WAVES ───────────────────────────────────────────────
// Reached with ?test=1 appended to the URL. Three short waves, each
// showing one group of the new systems, so a fault can be placed without
// guessing which of nine changes caused it.
//   1  arrival rule and damaged arrivals
//   2  non-combatants, scanning, standing asteroid field
//   3  defector and a cruiser that has to be disabled
// ?test=1 through ?test=4 all switch test mode on; the number chooses
// which of the four waves the run opens with, so the crossfire in wave 4
// does not have to be reached by playing the three before it.
const TEST_MATCH = /[?&]test=([1-4])/.exec(location.search);
const TEST_MODE  = !!TEST_MATCH;
const TEST_FIRST = TEST_MATCH ? parseInt(TEST_MATCH[1],10) : 1;

function testWing(q, t, type, spr, fac, count, wid, hpMul){
  const half=(count-1)*WING_SPACING*0.5;
  const mid=HUD_H+80+Math.random()*(H-HUD_H-160);
  for(let k=0;k<count;k++){
    q.push({time:t+k*WING_STAGGER, type:type, spr:spr, wing:wid, fac:fac,
            hpMul:hpMul||0, y:mid-half+k*WING_SPACING});
  }
}

function buildTestWave(n){
  // Everything getWaveDef normally sets has to be set here too, or the
  // previous wave leaves its state behind.
  currentEra = 'fs2';
  waveFeud = false;
  currentFaction = 'ntf';
  waveLive = 8;
  fleeTotal = 0; fleeEscaped = 0;
  guardWanted = false; guardSpawned = false; guardLost = false;
  guardClass = 'cruiser'; guardFrac = GUARD_HULL_FRAC; guardReward = 'cruiser';
  astAim = false; transitSecs = 0; guardGone = false;
  astStreamCd = AST_STREAM_MEAN;
  empOut = 0; empWarn = 0; empNext = 0;
  BOMB_PORTALS = []; bombRaidLeft = 0; bombRaidCd = 99999;
  reinfAt = 0; reinfDone = true;
  gateWings = true; gateWing = 0;
  disableTarget = null;
  waveMod = MOD_NONE;
  const q = [];

  if(n===1){
    // Eve of Destruction in miniature: four wings of damaged Vasudan
    // fighters, arriving one after the other. Hull runs 30/40/35/50 % so
    // the wave gets harder without a single extra ship.
    testWing(q, 60,  'fi_ntf', 'fianubis', 'vasudan', 2, ++wingSeq, 0.40);
    testWing(q, 200, 'fi_ntf', 'fianubis', 'vasudan', 2, ++wingSeq, 0.30);
    testWing(q, 340, 'fi_ntf', 'fianubis', 'vasudan', 3, ++wingSeq, 0.35);
    testWing(q, 480, 'fi_ntf', 'fianubis', 'vasudan', 3, ++wingSeq, 0.50);
  }
  else if(n===2){
    // Small Deadly Space in miniature. One freighter that runs when hit,
    // three containers to scan, three sentry guns that cannot come to the
    // player, and a standing field to fly through.
    waveMod = 'astfield';
    // The freighter still flies in from the right: it is passing through,
    // which is why catching it is the job. Everything else belongs to the
    // depot and is standing there when the wave opens.
    q.push({time:40, type:'freighter', spr:'frbast', fac:'vasudan', y:H*0.35});
    q.push({time:1, type:'container', spr:'fcvc3', fac:'vasudan',
            x:W*0.62, y:H*0.50, scan:1, noWarp:1});
    q.push({time:1, type:'container', spr:'fcvc3', fac:'vasudan',
            x:W*0.72, y:H*0.66, scan:1, noWarp:1});
    q.push({time:1, type:'container', spr:'fcvc3', fac:'vasudan',
            x:W*0.58, y:H*0.80, scan:1, noWarp:1});
    q.push({time:1, type:'sentry', spr:'sgtrident', fac:'shivan',
            x:W*0.86, y:H*0.30, noWarp:1});
    q.push({time:1, type:'sentry', spr:'sgtrident', fac:'shivan',
            x:W*0.88, y:H*0.58, noWarp:1});
    q.push({time:1, type:'sentry', spr:'sgtrident', fac:'shivan',
            x:W*0.84, y:H*0.82, noWarp:1});
    testWing(q, 500, 'fi_ntf', 'fibasilisk', 'shivan', 2, ++wingSeq, 0);
  }
  else if(n===4){
    // Out of the Dark, Into the Night in miniature, and the only test for
    // the crossfire. Vasudans first, then the unknowns, who go for the
    // Vasudans rather than for the player. FS1 rules are on: the cruiser
    // has no beam, and only the Vasudans fly without a shield.
    currentEra = 'fs1';
    waveFeud = true;
    waveLive = 12;
    testWing(q, 60,  'fi_ntf', 'fianubis', 'vasudan', 3, ++wingSeq, 0);
    testWing(q, 90,  'fi_ntf', 'fihorus',  'vasudan', 3, ++wingSeq, 0);
    testWing(q, 400, 'fi_ntf', 'fibasilisk', 'shivan', 3, ++wingSeq, 0);
    // Gating off for this one: both sides have to be on the field at the
    // same time or there is nothing to watch.
    gateWings = false;
    // Only the Vasudans. The first version stripped the shields from
    // everything already in the queue, the Basilisks included, which turns
    // the whole point of FS1 upside down: Shivan shields are the shock,
    // and the fleet has no answer to them until The Hammer and the Anvil.
    for(const s of q) if(s.fac==='vasudan') s.noShield = 1;
    q.push({time:200, type:'cr_ntf', spr:'craten', fac:'vasudan', y:H*0.5});
  }
  else {
    // First Strike in miniature plus the ruse from The Hammer and the
    // Anvil. The escort turns, and the cruiser has to be left alive and
    // useless rather than destroyed.
    // Hull at 1.6 so there is room to miss. Subsystems keep their own
    // size, so the work is unchanged at 492 points while the hull grows
    // from 1120 to 1792: at half accuracy the Cain now finishes at 59 %
    // instead of 34 %, which is the difference between a task and a test
    // of marksmanship.
    q.push({time:60, type:'cr_ntf', spr:'crcain', fac:'shivan', y:H*0.5,
            disable:1, hpMul:1.6});
    q.push({time:120, type:'defector', y:H*0.4});
    testWing(q, 600, 'fi_ntf', 'fibasilisk', 'shivan', 2, ++wingSeq, 0);
  }
  return q.sort(function(a,b){ return a.time-b.time; });
}
